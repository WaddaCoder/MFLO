<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MFLO Navigator v2.2</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1520;--card:#131E2D;--card2:#182639;--line:#223249;--accent:#3A7BD5;--gold:#C9A84C;--cream:#F3E9D2;--green:#5FBF8A;--text:#D7DEE8;--mut:#8393A8;--red:#D9776B;--fs:1.2}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#080E16}
body{color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',Georgia,serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);font-size:calc(14px*var(--fs));padding:16px 14px 20px}
@media(min-width:1024px){.app{max-width:1280px;padding:24px 40px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}}
.title{font-size:1.9em;line-height:1.1;color:var(--cream);font-weight:600}
.sub{color:var(--mut);font-size:.8em;margin-top:2px}
.search{width:100%;margin:14px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--cream);font:inherit;font-size:.85em;outline:none}
.search:focus{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;font-size:.8em;color:var(--mut);margin-bottom:14px;cursor:pointer;user-select:none}
.sw{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.2s}
.on .sw{background:var(--accent)}.on .sw:after{left:19px;background:#fff}
.arcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.arc{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.arc h3{font-size:1.25em;color:var(--cream);line-height:1.15}
.arc p{font-size:.72em;color:var(--mut);margin-top:6px}
.arc.a1{border-top:3px solid var(--accent)}.arc.a2{border-top:3px solid var(--gold)}
.pills{display:flex;gap:8px;margin:0 0 12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;flex-wrap:wrap}
.pill{font-size:.72em;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);background:var(--card);cursor:pointer}
.pill.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
.mod{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.mod.g{border-left-color:var(--gold)}.mod.f{border-left-color:var(--mut)}
.mod.soon{opacity:.45;cursor:default}
.mod .n{font-family:'Cormorant Garamond',serif;font-size:1.5em;color:var(--mut);width:22px}
.mod .t{flex:1;font-size:.88em;color:var(--cream);font-weight:500;line-height:1.25}
.mod .t small{display:block;color:var(--mut);font-weight:400;font-size:.8em}
.sec{font-size:.65em;border-radius:20px;padding:2px 8px;background:#1A2A42;color:#9DB8E0;white-space:nowrap}
.sec.gt{background:#3a2f12;color:var(--gold)}
.empty{color:var(--mut);font-size:.85em;padding:14px 0}
.foot{margin:18px 0 8px;padding:0 14px;text-align:center;font-size:.65em;line-height:1.6;color:var(--mut);overflow-wrap:anywhere}.foot span{display:block}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.home-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:15px;cursor:pointer}
.tag{font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:2px 9px}
.intro{font-size:.85em;margin:6px 0 12px}
.msearch{display:flex;gap:8px;margin-bottom:12px}
.msearch input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:.78em;color:var(--cream);outline:none;min-width:0}
.msearch button{border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:.72em;color:var(--mut);background:transparent;cursor:pointer}
.rail{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.rail.open{border-color:#2d4a73}
.rh{padding:11px 13px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rh .c{font-family:'Cormorant Garamond',serif;font-size:1.25em;color:var(--gold);min-width:46px}
.rh .tt{flex:1}
.rh .tt b{display:block;color:var(--cream);font-weight:600;font-size:.92em}
.rh .tt em{display:block;font-style:normal;color:var(--mut);font-size:.75em}
.rh:after{content:"+";color:var(--mut);font-size:1.2em}
.rail.open .rh:after{content:"\2212"}
.mk{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.mk i{font-style:normal;font-size:.66em;border-radius:6px;padding:1px 7px}
.ess{color:var(--gold);border:1px solid #6b5a2a}.exam{color:#8DB5F0;border:1px solid #2d4a73}.tests{color:var(--mut);font-style:italic!important}
.rb{padding:0 13px 13px;display:none}
.rail.open .rb{display:block}
.hook{background:linear-gradient(135deg,#2a2210,#1d1a10);border:1px solid #5a4a1e;border-radius:12px;padding:10px 12px;font-family:'Cormorant Garamond',serif;font-size:1.15em;color:#F1DFA6;line-height:1.3;margin-bottom:10px}
.pos{background:#16120a;border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;color:var(--cream);font-size:.82em;line-height:1.55;margin-bottom:10px}
.pos b{color:var(--gold)}
.pw{font-size:.8em;margin-bottom:10px}
.pw div{padding:5px 0;border-bottom:1px dashed var(--line)}
.pw strong{color:var(--cream)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.xlink{font-size:.7em;background:#142238;color:#9DB8E0;border:1px solid #2d4a73;border-radius:20px;padding:3px 10px;cursor:pointer}
.cases{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:10px;background:var(--card2)}
.cases h4{font-family:Inter,sans-serif;font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:500}
.case{font-size:.8em;margin-bottom:6px}.case b{color:var(--cream)}
.flag{display:inline-block;font-size:.65em;background:#3b1f1b;color:var(--red);border-radius:6px;padding:0 6px;margin-left:6px}
.bnd{background:#0f1f19;border:1px solid #1f4a37;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:.8em;color:#BFE6D0}
.bnd h4{font-family:Inter,sans-serif;font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:6px;font-weight:500}
.bnd p{margin-top:6px;font-size:.92em}
table{width:100%;border-collapse:collapse;font-size:.92em}
td,th{border-top:1px solid #1f4a37;padding:4px 5px;text-align:left;vertical-align:top}
th{color:var(--green);font-weight:600}
.spar{border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin-top:12px;font-size:.8em}
.spar summary{cursor:pointer;color:var(--mut)}
.sq{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.sq p{color:var(--cream)}
.sq textarea{width:100%;margin-top:6px;min-height:60px;background:var(--card);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;font-size:.95em}
.sq button{margin-top:6px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:5px 12px;font:inherit;font-size:.85em;cursor:pointer}
.sq .ans{display:none;margin-top:8px;background:#0f1f19;border:1px solid #1f4a37;border-radius:8px;padding:8px;color:#BFE6D0}
.sq.show .ans{display:block}
.legend{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.72em;color:var(--mut);background:var(--card)}
.legend i{font-style:normal}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow div{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card);font-size:.75em;color:var(--cream)}
.navrow div.soon{opacity:.4}
.navrow small{display:block;color:var(--mut)}
.fb{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font-size:.78em;color:var(--mut)}
.fb b{border:1px solid var(--line);border-radius:8px;padding:2px 10px;color:var(--cream);cursor:pointer;font-weight:600}
.gate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;margin-bottom:14px}
.gate h3{font-size:1.25em;color:var(--cream);margin-bottom:8px}
.step{display:flex;gap:11px}
.rail-l{display:flex;flex-direction:column;align-items:center}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.7em;color:var(--mut);background:var(--bg);flex:none}
.done .dot{background:var(--green);border-color:var(--green);color:var(--bg)}
.act .dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,76,.15)}
.ln{flex:1;width:2px;background:var(--line);min-height:14px}
.done .ln{background:var(--green)}
.sb{flex:1;padding-bottom:12px;min-width:0}
.sb b{display:block;font-size:.88em;color:var(--cream)}
.sb small{display:block;color:var(--mut);font-size:.75em}
.sb .nt{font-size:.78em;color:var(--text);margin-top:3px}
.pend .sb b{color:var(--mut)}
.q{margin-top:8px;background:var(--card2);border:1px solid #5a4a1e;border-radius:12px;padding:10px 12px;font-size:.82em;color:var(--cream)}
.btns{display:flex;gap:8px;margin-top:9px}
.btn{flex:1;text-align:center;border-radius:10px;padding:7px;font-size:.85em;font-weight:600;border:1px solid var(--line);color:var(--cream);background:var(--card);cursor:pointer}
.btn.y{background:var(--accent);border-color:var(--accent)}
.btn.bk{flex:.6;color:var(--mut);font-weight:500}
.tl{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 12px;font-size:.72em}
.tl label{display:flex;gap:8px;align-items:center;color:var(--mut);flex-wrap:wrap}
.tl input{background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:4px 8px;font:inherit;color-scheme:dark}
.bar{position:relative;height:8px;border-radius:6px;background:var(--line);margin:24px 6px 28px}
.bar .f{position:absolute;left:0;top:0;bottom:0;width:33%;background:var(--gold);border-radius:6px}
.bar .m{position:absolute;top:-5px;width:2px;height:18px;background:var(--cream)}
.bar .m span{position:absolute;top:19px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--mut);font-size:.95em}
.bar .m u{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;text-decoration:none;color:var(--cream);font-size:.95em}
.bar .m:last-child u{transform:translateX(-90%)}.bar .m:last-child span{transform:translateX(-90%)}
.res{background:#0f1f19;border:1px solid #1f4a37;border-radius:12px;padding:10px 12px;margin:2px 0 12px;font-size:.82em;color:#D6F0E2}
.res b{color:var(--green)}
.res.end{background:#1d1a10;border-color:#5a4a1e;color:var(--cream)}
.res.end b{color:var(--gold)}
.reset{display:inline-block;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.9em;color:var(--mut);cursor:pointer}
.hide{display:none!important}
.note{background:#1d1a10;border:1px solid #5a4a1e;border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:.8em;color:#E6D9AE}
.note b{color:var(--gold)}
.recall{background:#0f1f19;border:1px solid #1f4a37;border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:.8em;color:#BFE6D0}
.recall b{display:block;font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:3px}
.ex{background:#141b2a;border:1px dashed #2d4a73;border-radius:10px;padding:8px 11px;margin-bottom:10px;font-size:.78em;color:#C9D6EA}
.ex b{display:block;font-size:.85em;letter-spacing:.1em;text-transform:uppercase;color:#8DB5F0;margin-bottom:3px}
.flag.ok{background:#16232f;color:var(--mut)}
.mod .cnt{font-size:.62em;color:var(--mut);margin-left:6px}
.tl.nodate{display:none}
.fin{font-size:.78em;color:var(--mut);margin-top:8px}
.flat{columns:1}@media(min-width:1024px){.flat #rails{columns:2;column-gap:28px}.flat .rail{break-inside:avoid}}
.nomatch,.empty{color:var(--mut);font-size:.85em;text-align:center;padding:18px 8px}
.toggle,.pill,.xlink,.reset{min-height:36px;display:inline-flex;align-items:center}
.btn{min-height:40px;display:flex;align-items:center;justify-content:center}
[data-act]:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fb b{min-height:38px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}

</style>
</head>

<script>
var MD={};
var MODS=[
 {n:1,t:'Scope, definitions, overriding effect',sec:'ss.1-3',arc:'f',tag:'Frame'},
 {n:3,t:'Registration of marriage',sec:'s.5',arc:'n',tag:'Entering'},
 {n:4,t:'Polygamy',sec:'s.6',arc:'n',tag:'Entering · Gate'},
 {n:8,t:'Dower',sec:'s.10',arc:'n',tag:'Entering'},
 {n:5,t:'Talaq',sec:'s.7',arc:'e',tag:'Ending · Gate (timeline)'},
 {n:6,t:'Dissolution otherwise than by talaq',sec:'s.8',arc:'e',tag:'Ending'},
 {n:7,t:'Maintenance',sec:'s.9',arc:'e',tag:'Ending'},
 {n:2,t:'Succession',sec:'s.4',arc:'e',tag:'Ending'},
 {n:9,t:'Rules and omitted sections',sec:'ss.11-13',arc:'f',tag:'Frame'}
];

MD[1]={
 tag:'Module 1 · ss.1-3 · Frame',
 title:'Scope, definitions, overriding effect',
 intro:'Before the rules, the rulebook: who the Ordinance covers, what its four defined words mean, and why it beats custom. Every later section runs through the Chairman and the Arbitration Council, so learn those two first.',
 recall:'Applies to Muslim citizens, wherever they are (s.1(2)). Two bodies do the work: the <b>Chairman</b> and the <b>Arbitration Council</b> (s.2). Custom and other laws give way (s.3(1)); court procedure laws do not govern the Council (s.3(2)).',
 rails:[
 {id:'r1',code:'Preamble s.1(1)',term:'Long title, preamble and short title',sub:'Gives effect to recommendations of the Commission on Marriage and Family Laws',tests:'source and purpose of the Ordinance',
  hook:'An Ordinance with a pedigree: it is the Commission’s homework turned into law by presidential pen, not by a legislature.',
  text:'<b>An Ordinance</b> to give effect to certain recommendations of the Commission on Marriage and Family Laws.<br><b>WHEREAS</b> it is expedient to give effect to certain recommendations of the Commission on Marriage and Family Laws; <b>Now, THEREFORE,</b> in pursuance of the Proclamation of the seventh day of October, 1958, and in exercise of all powers enabling him in that behalf, the President is pleased to make and promulgate the following Ordinance:<br><b>1. (1)</b> This Ordinance may be called the Muslim Family Laws Ordinance, 1961.',
  plain:[['Ordinance','a law made by the President, not passed by a legislature; this one is Ordinance No. VIII of 1961, dated 2 March 1961.'],['Commission on Marriage and Family Laws','the body whose recommendations the Ordinance carries out; its report is the background for the whole text.'],['Proclamation of the seventh day of October, 1958','the instrument the preamble names as the source of the President’s power to legislate.']],
  links:[['s.1(3) commencement','r3'],['ss.12, 13: omitted sections','9:r3']],cases:[],
  bnd:'<h4>Boundary map: what the preamble tells you</h4><table><tr><th>Question</th><th>Answer in the text</th></tr><tr><td>Who made it?</td><td>the President, by Ordinance</td></tr><tr><td>Why?</td><td>to give effect to “certain” recommendations only, not all of them</td></tr><tr><td>Does it list what the Commission recommended?</td><td>no; the text does not say which recommendations</td></tr></table>'},
 {id:'r2',code:'s.1(2)',term:'Extent and application',sub:'Whole of Pakistan; all Muslim citizens, wherever they may be',ess:'Muslim citizens of Pakistan',exam:true,
  hook:'The Ordinance follows the person, not the postcode: a Muslim citizen carries it to Dubai.',
  text:'<b>(2)</b> It extends to the whole of Pakistan, and applies to all Muslim citizens of Pakistan, wherever they may be.',
  plain:[['extends to','the territory where the law runs: the whole of Pakistan.'],['applies to','the people it binds: Muslim citizens of Pakistan.'],['wherever they may be','the reach follows the citizen abroad; it is not limited to Pakistani soil.']],
  ex:'A Pakistani Muslim man living in Dubai pronounces talaq there. Section 1(2) reaches him as a Muslim citizen wherever he is, so s.7 is engaged on its words. How the notice reaches a Chairman from abroad is a question about s.2(b), not s.1(2).',
  links:[['s.2(b) Chairman','r5'],['s.7(1) notice','5:r1'],['s.3(1) override','r7']],
  cases:[
   {n:'Syed Ali Nawaz Gardezi v Lt Col Muhammad Yusuf',c:'Supreme Court of Pakistan, PLD 1963 SC 51',t:'Reported in a secondary article (Islamabad Law Review, 2023) as holding that the Ordinance reaches a marriage between a Pakistani Muslim man and a non-citizen Muslim woman, or even a non-Muslim woman. Holding read second-hand; the report itself was not seen.',v:1,fl:'secondary article'},
   {n:'Dilshad Bibi v her husband (named Liaqat Ali Mir in some reports, Muzaffar Mir in another)',c:'Islamabad High Court, June 2019, Athar Minallah CJ',t:'Reported as holding that the Ordinance applies throughout Pakistan to Muslim citizens: a husband living in Azad Kashmir who held a national identity card was a citizen, and the registration in Islamabad gave the Islamabad court jurisdiction.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: persons against s.1(2)</h4><table><tr><th>Person</th><th>Reached by the words?</th></tr><tr><td>Muslim citizen in Pakistan</td><td>yes</td></tr><tr><td>Muslim citizen abroad</td><td>yes (“wherever they may be”)</td></tr><tr><td>Muslim citizen living in Azad Kashmir</td><td>yes on the IHC 2019 report (citizenship by identity card)</td></tr><tr><td>Non-Muslim citizen</td><td>no</td></tr><tr><td>Muslim who is not a citizen</td><td>not by the words; but a Pakistani Muslim man marrying a non-citizen woman is within it (Gardezi, as reported)</td></tr><tr><td>Person whose Muslim status is disputed</td><td>the text is silent</td></tr></table><p>Sub-section (2) says nothing about sect. Jafri provisions inserted in 2021 (s.4(2) to (8), s.7 proviso and (1A)) apply to Fiqah-e-Jafria parties, so “Muslim” in s.1(2) covers Shia and Sunni alike.</p>'},
 {id:'r3',code:'s.1(3)',term:'Commencement',sub:'On a date the Federal Government appoints by Gazette notification',tests:'when the Ordinance began',
  hook:'Born 2 March 1961, switched on 15 July 1961: four and a half months of waiting in the wings.',
  text:'<b>(3)</b> It shall come into force on such date as the Federal Government may, by notification in the official Gazette, appoint in this behalf.',
  plain:[['Federal Government','substituted for “Central Government” by F.A.O. 1975 (printed footnote).'],['notification in the official Gazette','a published government notice; the date itself is not in the text but in a footnote.'],['15 July 1961','the date given in the printed footnote (Gazette of Pakistan, S.R.O. 56 (R), 1961).']],
  links:[['s.4 succession','2:r1'],['ss.12, 13: omitted sections','9:r3']],cases:[],
  bnd:'<h4>Boundary map: dates around the Ordinance (from the printed footnotes)</h4><table><tr><th>Date</th><th>Event</th></tr><tr><td>7 Oct 1958</td><td>Proclamation named in the preamble</td></tr><tr><td>2 Mar 1961</td><td>Ordinance made</td></tr><tr><td>15 Jul 1961</td><td>comes into force (S.R.O. 56 (R))</td></tr><tr><td>1961</td><td>Amending Ordinances XXI and XXX of 1961 (s.2 and s.7(5) wording)</td></tr><tr><td>1964, 1975</td><td>A.O. 1964 and F.A.O. 1975 substitute the authorities named in ss.2(b), 6(4), 9(2), 11</td></tr><tr><td>1981</td><td>ss.12 and 13 omitted (Ordinance XXVII of 1981)</td></tr><tr><td>2021</td><td>Acts XXVIII and XXIX add s.4(2) to (8), the s.7 proviso and s.7(1A)</td></tr><tr><td>10 Mar 2022</td><td>“updated till” date of the bare act used here</td></tr></table><p>Anything after 10-3-2022 is not covered by this build.</p>'},
 {id:'r4',code:'s.2(a)',term:'“Arbitration Council”',sub:'Chairman plus a representative of each party; the body formed without a defaulting party’s nominee still counts',ess:'Chairman + one representative per party',exam:true,
  hook:'Three chairs at the table: the Chairman, and one nominee from each side. If one side will not send a nominee, the table is set for two and the meeting goes ahead.',
  text:'<b>2. Definitions.</b>&mdash;In this Ordinance unless there is anything repugnant in the subject or context,&mdash;<br><b>(a)</b> “Arbitration Council” means a body consisting of the Chairman and a representative of each of the parties to a matter dealt with in this Ordinance:<br><b>Provided</b> that where any party fails to nominate a representative within the prescribed time, the body formed without such representative shall be the Arbitration Council;',
  plain:[['body','a group, not a court; s.3(2) keeps court procedure laws away from it.'],['representative of each of the parties','one nominee for each side of the matter (husband, wife; for s.6, the applicant and each existing wife).'],['within the prescribed time','a period fixed by rules under s.11 (s.2(c)).'],['the words “of the Union Council”','were omitted after “Chairman” by Ordinance XXI of 1961 (printed footnote).']],
  ex:'Husband applies under s.6 to marry a second wife. The Chairman asks the husband and the first wife each to nominate a representative. The first wife names no one within the prescribed time. The Council is the Chairman and the husband’s nominee: it is still the Arbitration Council.',
  links:[['s.2(b) Chairman','r5'],['s.6(3) Council on polygamy','4:r3'],['s.7(4) Council on talaq','5:r6'],['s.9(1) Council on maintenance','7:r1'],['s.3(2) procedure','r8']],cases:[],
  bnd:'<h4>Boundary map: who sits, by matter</h4><table><tr><th>Matter</th><th>Chairman</th><th>Representatives</th></tr><tr><td>s.6 second marriage</td><td>yes</td><td>applicant and each existing wife (s.6(3))</td></tr><tr><td>s.7 talaq (reconciliation)</td><td>yes</td><td>husband and wife, by s.2(a)</td></tr><tr><td>s.8 delegated or other dissolution</td><td>yes</td><td>as for s.7, mutatis mutandis</td></tr><tr><td>s.9 maintenance</td><td>yes</td><td>wife or wives and husband, by s.2(a)</td></tr><tr><td>A party names no nominee in time</td><td>yes</td><td>body without that representative is still the Council</td></tr></table>'},
 {id:'r5',code:'s.2(b)',term:'“Chairman”',sub:'Union Council Chairman, or an appointee; a Muslim member is elected if he cannot or should not act',ess:'who discharges the Chairman’s functions',exam:true,
  hook:'The Chairman is a job, not a person: whoever is lawfully filling it does the Chairman’s work for this Ordinance.',
  text:'<b>(b)</b> ‘Chairman’ means the Chairman of the Union Council or a person appointed by the Federal Government in the Cantonment areas, or by the Provincial Government in other areas, or by an officer authorized in that behalf by any such Government, to discharge the functions of Chairman under this Ordinance:<br><b>Provided</b> that where the Chairman of the Union Council is a non-Muslim, or he himself wishes to make an application to the Arbitration Council, or is, owing to illness or any other reason, unable to discharge the functions of Chairman, the Council shall elect one of its Muslim members as Chairman for the purposes of this Ordinance;',
  plain:[['Union Council','see s.2(d): the Union Council or the Town or Union Committee under the Basic Democracies Order, 1959.'],['Cantonment areas','the Federal Government appoints the Chairman there; elsewhere the Provincial Government (or an officer it authorizes).'],['the Council shall elect','here “the Council” is the Union Council electing one of its own Muslim members, not the Arbitration Council.'],['he himself wishes to make an application','a Chairman who is a party himself steps aside for that matter.']],
  links:[['s.2(a) Arbitration Council','r4'],['s.2(d) Union Council','r6'],['s.7(4) Chairman’s thirty days','5:r6']],cases:[],
  bnd:'<h4>Boundary map: who acts as Chairman</h4><table><tr><th>Situation</th><th>Who acts</th></tr><tr><td>Ordinary case, Union Council area</td><td>Chairman of the Union Council</td></tr><tr><td>Cantonment area</td><td>person appointed by the Federal Government (or its authorized officer)</td></tr><tr><td>Other area</td><td>person appointed by the Provincial Government (or its authorized officer)</td></tr><tr><td>Chairman is non-Muslim</td><td>the Union Council elects one of its Muslim members</td></tr><tr><td>Chairman wishes to apply himself</td><td>same: a Muslim member is elected</td></tr><tr><td>Chairman ill or otherwise unable</td><td>same: a Muslim member is elected</td></tr></table><p>The text does not say what happens if no Muslim member exists. Not answered; open to argument.</p>'},
 {id:'r6',code:'s.2(c)-(e)',term:'“Prescribed”, “Union Council”, “Ward”',sub:'Three short definitions that point to rules and the Basic Democracies Order',tests:'meaning of prescribed, Union Council and Ward',
  hook:'Three small dictionary entries, each one a signpost to somewhere else: rules, an Order, an Order.',
  text:'<b>(c)</b> “Prescribed” means prescribed by rules made under section 11;<br><b>(d)</b> “Union Council” means the Union Council or the Town or Union Committee constituted under the Basic Democracies Order, 1959, and having in the matter jurisdiction as prescribed;<br><b>(e)</b> “Ward” means a ward within a Union or Town as defined in the aforesaid Order.',
  plain:[['prescribed','fixed by rules under s.11, so every “prescribed” fee, form and period is found in the Rules, not in the Ordinance.'],['Basic Democracies Order, 1959','the 1959 local-government scheme the Ordinance was built on; the Ordinance still refers to it by name.'],['having in the matter jurisdiction as prescribed','the Union Council that has jurisdiction over the matter as the rules say (wording substituted by Ordinance XXI of 1961).'],['Ward','a ward inside a Union or Town; s.5(2) allows one Nikah Registrar per Ward.']],
  links:[['s.11 rules','9:r1'],['s.5(2) one Registrar per Ward','3:r2'],['s.2(b) Chairman','r5']],cases:[],
  bnd:'<h4>Boundary map: what is left to the Rules</h4><table><tr><th>Provision</th><th>Left to “prescribed”</th></tr><tr><td>s.2(a) proviso</td><td>time to nominate a representative</td></tr><tr><td>s.5(5)</td><td>nikah nama form, registers, records, manner, fees</td></tr><tr><td>s.6(2), (4)</td><td>manner and fee of the application; manner, period and fee of revision</td></tr><tr><td>s.9(2)</td><td>manner, period and fee of revision</td></tr></table>'},
 {id:'r7',code:'s.3(1)',term:'Overriding effect',sub:'Notwithstanding any law, custom or usage; registration only in accordance with the Ordinance',ess:'notwithstanding any law, custom or usage',exam:true,
  hook:'When the Ordinance and custom collide, custom is the one that moves aside.',
  text:'<b>3. Ordinance to override other laws, etc.</b>&mdash;<b>(1)</b> The provisions of this Ordinance shall have effect notwithstanding any law, custom or usage, and the registration of Muslim marriages shall take place only in accordance with those provisions.',
  plain:[['notwithstanding','despite; where another law or custom says otherwise, this Ordinance wins.'],['custom or usage','long-practised community habit; it cannot displace the Ordinance.'],['only in accordance with those provisions','a Muslim marriage can be registered in no other way than the one the Ordinance sets out.']],
  ex:'A community custom says a marriage needs no paper and no report. Section 3(1) says the Ordinance applies regardless, so s.5 still requires registration. The nikah itself may still be valid unregistered (see Module 3): the override is about the duty to register, not about the validity of the marriage.',
  links:[['s.5(1) registration','3:r1'],['s.3(2) procedure','r8'],['s.1(2) reach','r2']],cases:[],
  bnd:'<h4>Boundary map: what yields to s.3(1)</h4><table><tr><th>Competing source</th><th>Result</th></tr><tr><td>Any other law</td><td>Ordinance prevails (to the extent of conflict)</td></tr><tr><td>Custom</td><td>Ordinance prevails</td></tr><tr><td>Usage</td><td>Ordinance prevails</td></tr><tr><td>Another way of registering a Muslim marriage</td><td>not allowed: only the Ordinance’s way</td></tr></table><p>Whether a provincial registration law (such as Sindh’s 1995 Act) sits alongside the Ordinance after the 18th Amendment is outside the text and not checked here.</p>'},
 {id:'r8',code:'s.3(2)',term:'Court procedure laws do not govern the Arbitration Council',sub:'Arbitration Act 1940, Code of Civil Procedure 1908 and other procedural laws are shut out',ess:'no court-procedure law applies',exam:true,
  hook:'The Council is a conversation with teeth, not a mini-trial: no pleadings, no CPC.',
  text:'<b>(2)</b> For the removal of doubt, it is hereby declared that the provisions of the Arbitration Act, 1940 (X of 1940), the Code of Civil Procedure 1908 (Act V of 1908), and any other law regulating the procedure of courts shall not apply to any Arbitration Council.',
  plain:[['for the removal of doubt','a clarification: the drafter is stating what he believes is already so.'],['Arbitration Act, 1940','the general arbitration statute; not applied to the Arbitration Council.'],['any other law regulating the procedure of courts','a catch-all; includes court procedure laws beyond the two named.']],
  ex:'A wife in a s.9 maintenance matter asks the Arbitration Council to issue notices under Order V of the CPC. By s.3(2) the CPC does not apply to the Council: it follows the Ordinance and the Rules, not the CPC.',
  links:[['s.7(1) proviso (c): Mujtahid-e-Alam’s award','5:r2'],['s.4(7) Mujtahid-e-Alam','2:r7'],['s.2(a) Council','r4']],cases:[],
  bnd:'<h4>Boundary map: which procedure applies to which body</h4><table><tr><th>Body</th><th>Arbitration Act 1940</th><th>CPC / court procedure</th></tr><tr><td>Arbitration Council (s.2(a))</td><td>no (s.3(2))</td><td>no (s.3(2))</td></tr><tr><td>Mujtahid-e-Alam’s decision (s.4(7), s.7 proviso (c))</td><td>yes: has the status of an award dealt with under the Act</td><td>text silent</td></tr><tr><td>A court of competent jurisdiction</td><td>not relevant</td><td>its own procedure</td></tr></table><p>The contrast is the point: the same Ordinance shuts the Arbitration Act out for the Council (s.3(2)) and brings it in for the Mujtahid-e-Alam (ss.4(7), 7 proviso (c)).</p>'}
 ],
 spar:[
  {q:'A Muslim citizen of Pakistan, settled in Dubai, pronounces talaq there. Is the Ordinance engaged, and which definition decides who receives his notice?',a:'Yes on the words of s.1(2): it applies to Muslim citizens “wherever they may be”. Who acts as Chairman is a question for s.2(b): the Union Council Chairman, or a person appointed by the Federal Government (Cantonment areas) or the Provincial Government (other areas). The text does not speak of overseas missions; not checked.'},
  {q:'Cross-module: a village custom says nikah needs no report to anyone. Does the custom beat s.5, and does non-registration make the marriage void?',a:'The custom does not beat s.5: s.3(1) says the Ordinance has effect notwithstanding custom or usage. Whether the marriage is void is a different question: the Federal Shariat Court in Arif Hussain v The State (PLD 1982 FSC 42) is reported as holding that non-registration does not invalidate an otherwise valid nikah; the penalty is in s.5(4). See Module 3.'},
  {q:'The Arbitration Council and a Mujtahid-e-Alam both decide disputes under this Ordinance. Which procedural law applies to each?',a:'Arbitration Council: neither the Arbitration Act 1940 nor the CPC (s.3(2)). Mujtahid-e-Alam: his decision has the status of an award and is dealt with under the Arbitration Act 1940 (s.4(7); s.7 proviso (c)). Same statute, opposite answers.'},
  {q:'Cross-section: the Union Council Chairman himself wants to take a second wife and applies under s.6. Who acts as Chairman for his own application, and would the answer change if he were a non-Muslim?',a:'Under the s.2(b) proviso, where the Chairman “himself wishes to make an application to the Arbitration Council”, the Union Council elects one of its Muslim members as Chairman for the purposes of the Ordinance. The same proviso applies where the Chairman is a non-Muslim or is unable to act, so the answer on who acts is the same. The text does not say what follows if the Union Council has no Muslim member; not answered.'}
 ]
};

MD[2]={
 tag:'Module 2 · s.4 · Accordion',
 title:'Succession',
 intro:'Section 4 started as one sentence rescuing orphaned grandchildren (1961) and grew in 2021 into eight sub-sections that also cover widows and Jafri husbands. Read (1) first, then the 2021 block, (2) to (8).',
 note:'<b>Two layers.</b> Sub-section (1) is the 1961 text. Sub-sections (2) to (8) were added by Act XXVIII of 2021 (printed footnote). Source typos are kept as printed: “per stripes” for per stirpes, and “Ahl-e-Teshih” in (2) against “Ahl-e-Tashih” in (8).',
 recall:'Predeceased child&rsquo;s children take the parent&rsquo;s share (1). 2021 block: widow 1/4 or 1/8 (2), split among widows (3), value at payment day (4), movable property too (5), Jafri husband 1/2 or 1/4 (6), disputes to court or Mujtahid-e-Alam (7), Jafri law governs Ahl-e-Tashih (8).',
 rails:[
 {id:'r1',code:'s.4(1)',term:'Orphaned grandchildren take their parent’s share',sub:'Per stirpes; only children living when the succession opens',ess:'predeceased son or daughter; children living at the opening; per stirpes',exam:true,
  hook:'A father who died too early still has a seat at the table: his children sit in it, together.',
  text:'<b>4. Succession.</b>&mdash;<b>(1)</b> In the event of the death of any son or daughter of the propositus before the opening of succession, the children of such son or daughter, if any, living at the time the succession opens, shall per stripes receive a share equivalent to the share which such son or daughter, as the case may be, would have received if alive.',
  plain:[['propositus','the person whose estate is being divided, the deceased owner.'],['opening of succession','the moment of the propositus’s death, when the heirs’ rights arise.'],['per stirpes (printed “per stripes”)','by branch: the children of one predeceased child share that child’s one portion between them.'],['living at the time the succession opens','only grandchildren alive at the propositus’s death qualify.'],['share … would have received if alive','the grandchildren take what their parent would have taken; the section sets no new fraction.']],
  ex:'Propositus P dies leaving an estate of Rs 120. Heirs: son A, daughter E, and two children C and D of son B, who died before P. Had B lived, the shares would be A 48, B 48, E 24 (sons double a daughter). Under s.4(1), C and D take B’s Rs 48 between them. How C and D divide the 48 is not stated in s.4 and falls to the general law.',
  links:[['s.4(8) Jafri law','r8'],['s.1(3) commencement','1:r3'],['ss.12, 13: omitted sections','9:r3']],
  cases:[
   {n:'Allah Rakha and others v Federation of Pakistan',c:'Federal Shariat Court, PLD 2000 FSC 1',t:'Held s.4 repugnant to the Injunctions of Islam, with effect from 31 March 2000 as read in a Sindh High Court judgment; the same judgment is reported to have held the restriction on polygamy in s.6 within the Injunctions. Appeal to the Shariat Appellate Bench: a March 2022 news report says it was still pending and that an appeal stays the FSC decision under the proviso to Article 203D(2). Whether it has since been decided was not re-checked.',v:1,fl:'news and court report'},
   {n:'Great-grandchildren case (propositus Mrs Tameez un Nisa; title not given in the report)',c:'Supreme Court of Pakistan, reported 3 March 2022; three-judge bench led by CJP Umar Ata Bandial, judgment by Munib Akhtar J',t:'Held that s.4 does not reach great-grandchildren: it covers only grandchildren alive when the succession opens, and the words “living at the time the succession opens” cannot be read away.',v:1,fl:'news report'},
   {n:'Legal heirs of Javed Iqbal Rana (title not given in the report)',c:'Federal Constitutional Court of Pakistan, 24 September 2026; Amin-ud-Din Khan CJ and Ali Baqar Najafi J',t:'Held that s.4 does not extend to the children of a predeceased brother: it covers only the category it names. Petition dismissed and the Lahore High Court order of 18 March 2026 upheld. Any claim under general Muslim law is for separate assessment.',v:1,fl:'news report'},
   {n:'Mst. Farishta v Federation of Pakistan; Federation of Pakistan v Mst. Farishta',c:'Peshawar High Court Shariat Bench PLD 1980 Pesh 47; Supreme Court Shariat Bench PLD 1981 SC 120',t:'The Peshawar Shariat Bench held s.4 repugnant to Islam; the Supreme Court reversed on jurisdiction, treating the Ordinance as “Muslim Personal Law” outside the Federal Shariat Court. Read in a LUMS Law Journal article and a Sindh High Court judgment; the reports themselves were not seen.',v:1,fl:'secondary'},
   {n:'Zainab v Kamal Khan',c:'Supreme Court, PLD 1990 SC 1051',t:'Cited in a Sindh High Court judgment as a Supreme Court decision on the interpretation of s.4. The holding was not read; shown as a pointer only.',v:2}
  ],
  bnd:'<h4>Boundary map: whose child, which generation, when</h4><table><tr><th>Facts</th><th>s.4(1)?</th></tr><tr><td>Child of the propositus alive at the opening</td><td>not needed: ordinary heir</td></tr><tr><td>Child of the propositus died before the opening; a child of that child is alive at the opening</td><td>yes: that grandchild takes the parent’s share</td></tr><tr><td>Same, but the grandchild also died before the opening; a great-grandchild is alive</td><td>no (Supreme Court 2022, as reported)</td></tr><tr><td>Child of the propositus’s predeceased brother (nephew)</td><td>no (FCCP Sept 2026, as reported)</td></tr><tr><td>Child of the propositus died after the opening</td><td>no: the child was already an heir; the share passes through the child’s own estate</td></tr><tr><td>Predeceased child left no children</td><td>nothing to take</td></tr><tr><td>Grandchild born after the opening</td><td>not “living at the time”; the text does not address a child in the womb</td></tr><tr><td>Succession opened before 15 July 1961</td><td>not engaged on the reasoning of a Sindh High Court judgment read in part; section applies forward</td></tr></table>'},
 {id:'r2',code:'s.4(2)',term:'Widow’s share in immovable property (Ahl-e-Teshih)',sub:'One-fourth if no child; one-eighth if there is a child',ess:'Muslim male of Ahl-e-Teshih; immovable property; 1/4 or 1/8',exam:true,
  hook:'Two numbers to remember, and one switch between them: a child in the picture turns one-fourth into one-eighth.',
  text:'<b>(2)</b> If a Muslim male from Ahl-e-Teshih dies, the share of a widow in the immovable property left behind by her deceased husband shall be as follows:&mdash;<br><b>(a)</b> one-fourth share of the fixed price or value of the property, if there is no child left behind the deceased husband; and<br><b>(b)</b> one-eighth share, if there is child left behind.',
  plain:[['Ahl-e-Teshih','printed so in (2); (8) prints “Ahl-e-Tashih” and ties it to Fiqah-e-Jafria (Shia). The two are read as the same group.'],['immovable property','land, buildings and the like; movable property is dealt with in (5).'],['fixed price or value','the widow receives a fraction of the property’s money value, not necessarily the property itself (see (4)).'],['child left behind','a child of the deceased husband; the text does not say whether the child must be the widow’s own.']],
  ex:'A Shia husband dies leaving one widow, no child, and a house valued at Rs 800. Her share is one-fourth of the value: Rs 200. If he had left a child, one-eighth: Rs 100.',
  links:[['s.4(3) two or more widows','r3'],['s.4(4) valuation','r4'],['s.4(5) movable property','r5'],['s.4(8) Jafri law','r8']],cases:[],
  bnd:'<h4>Boundary map: the widow’s fraction in immovable property</h4><table><tr><th>Facts</th><th>Widow’s share</th></tr><tr><td>No child left behind</td><td>1/4 of the fixed price or value</td></tr><tr><td>A child left behind</td><td>1/8</td></tr><tr><td>Two or more widows</td><td>that fraction is divided equally among them (s.4(3))</td></tr><tr><td>Husband not of Ahl-e-Teshih</td><td>sub-section (2) is not engaged on its words</td></tr><tr><td>Child is from another wife</td><td>text silent; “child left behind the deceased husband” is not limited to her own child</td></tr></table><p>Background: a 2019 Dawn report described the proposal as protecting childless Shia widows’ right to one-fourth of the estate; secondary source.</p>'},
 {id:'r3',code:'s.4(3)',term:'Two or more widows share equally',sub:'The sub-section (2) fraction is divided, not multiplied',ess:'divided equally',
  hook:'The pie does not grow with the number of widows; the slices get thinner.',
  text:'<b>(3)</b> If there are two or more widows, the share, as mentioned in sub-section (2), shall be divided equally among them.',
  plain:[['the share, as mentioned in sub-section (2)','the single 1/4 or 1/8 fraction, not a fraction per widow.'],['divided equally','each widow takes the same part of that fraction.']],
  ex:'The Rs 800 house: no child, two widows. Total widows’ share 1/4 of 800 = Rs 200; each widow takes Rs 100. With a child: 1/8 of 800 = Rs 100; each takes Rs 50.',
  links:[['s.4(2)','r2'],['s.4(5): applies to movables too','r5']],cases:[],
  bnd:'<h4>Boundary map: number of widows</h4><table><tr><th>Widows</th><th>Total share (no child)</th><th>Each widow</th></tr><tr><td>1</td><td>1/4</td><td>1/4</td></tr><tr><td>2</td><td>1/4</td><td>1/8</td></tr><tr><td>3</td><td>1/4</td><td>1/12</td></tr><tr><td>4</td><td>1/4</td><td>1/16</td></tr></table><p>With a child, replace 1/4 by 1/8 throughout. Compare s.6: the Ordinance fixes no ceiling on the number of wives; the table shows the arithmetic only.</p>'},
 {id:'r4',code:'s.4(4)',term:'Value is fixed at payment, not at death',sub:'If heirs do not pay, the widow takes her share in the corpus of the immovable property',ess:'value at the time of payment; corpus if unpaid',exam:true,
  hook:'The clock for the price is the day you pay, not the day he died.',
  text:'<b>(4)</b> The price or value of the property shall be the price or value existing at the time of payment and not the price or value which existed at the time of death of the husband:<br><b>Provided</b> that if the legal heirs of the deceased do not give the widow her share in the above terms, she shall become entitled to her due share in the corpus of immovable property.',
  plain:[['time of payment','the day the heirs actually pay her; the value on that day counts.'],['not … at the time of death','a rising market after death helps the widow, not the heirs.'],['corpus','the property itself, as against its money value.'],['do not give the widow her share in the above terms','a failure to pay on the s.4(2) to (4) terms triggers the proviso.']],
  ex:'The house was worth Rs 800 at the husband’s death and Rs 1,200 when the heirs pay. One widow, no child: 1/4 of Rs 1,200 = Rs 300, not Rs 200. If the heirs do not pay, she holds a 1/4 share in the house itself.',
  links:[['s.4(2)','r2'],['s.4(5)','r5']],cases:[],
  bnd:'<h4>Boundary map: time points and the widow’s remedy</h4><table><tr><th>Point</th><th>Position</th></tr><tr><td>Death of husband</td><td>succession opens; value at this date is not the measure</td></tr><tr><td>Heirs pay the share</td><td>value on the day of payment is the measure</td></tr><tr><td>Heirs do not pay</td><td>proviso: widow is entitled to her due share in the corpus</td></tr><tr><td>How long the heirs may take before it counts as “do not give”</td><td>text silent; open to argument</td></tr></table>'},
 {id:'r5',code:'s.4(5)',term:'Movable property too',sub:'Widow’s share in the corpus; (2) and (3) apply mutatis mutandis',ess:'corpus of movable property',
  hook:'The same fractions follow the cash, the jewellery and the car.',
  text:'<b>(5)</b> A widow is entitled to her share in the corpus of movable property of her deceased husband provided that the provisions of sub-sections (2) and (3) shall mutatis mutandis apply.',
  plain:[['corpus of movable property','the movables themselves (cash, vehicles, jewellery and the like), not just a money value.'],['mutatis mutandis','with the necessary changes: the same fractions and the equal split among widows apply to movables.']],
  links:[['s.4(2)','r2'],['s.4(3)','r3'],['s.4(4) immovables: value or corpus','r4']],cases:[],
  bnd:'<h4>Boundary map: property type against remedy</h4><table><tr><th>Property</th><th>Sub-section</th><th>What the widow gets</th></tr><tr><td>Immovable</td><td>(2), (4)</td><td>fraction of value at payment; corpus if unpaid</td></tr><tr><td>Movable</td><td>(5)</td><td>fraction of the corpus itself</td></tr><tr><td>Mixed estate</td><td>(2) and (5)</td><td>each part by its own rule; text silent on combining them</td></tr></table>'},
 {id:'r6',code:'s.4(6)',term:'Jafri husband’s share in his deceased wife’s property',sub:'One-half if no child; one-fourth if there is a child',ess:'movable or immovable; 1/2 or 1/4',exam:true,
  hook:'The mirror image of the widow’s share, and much bigger: half without a child, a quarter with one.',
  text:'<b>(6)</b> Fiqah-e-Jafri recognizes right of a husband to get his share from the property left by his deceased wife, either movable or immovable, as follows:&mdash;<br><b>(a)</b> one-half share, if there is no child left behind; and<br><b>(b)</b> one-fourth share of the property, if there is child left behind.',
  plain:[['Fiqah-e-Jafri','the Jafri (Shia) school; the sub-section states what that school “recognizes” and gives the husband those shares.'],['either movable or immovable','both kinds of property, with no separate rule for each.'],['child left behind','a child of the deceased wife.']],
  ex:'A Shia wife dies leaving Rs 400 of property and no child. Her husband’s share: one-half = Rs 200. With a child: one-fourth = Rs 100.',
  links:[['s.4(2) widow’s share','r2'],['s.4(8)','r8']],cases:[],
  bnd:'<h4>Boundary map: spouse against spouse</h4><table><tr><th>Survivor</th><th>No child</th><th>Child left</th></tr><tr><td>Widow (immovable, s.4(2))</td><td>1/4</td><td>1/8</td></tr><tr><td>Widow (movable, s.4(5))</td><td>1/4</td><td>1/8</td></tr><tr><td>Jafri husband (s.4(6))</td><td>1/2</td><td>1/4</td></tr></table><p>The widow’s share in (2) is expressed as a share of the “price or value”, and in (4) and (5) as a share in the corpus; the husband’s share in (6) is simply a “share of the property”. The text does not say whether the husband’s share is likewise measured at the date of payment.</p>'},
 {id:'r7',code:'s.4(7)',term:'Disputes: court or Mujtahid-e-Alam',sub:'His decision has the status of an award under the Arbitration Act, 1940',ess:'court, or Mujtahid-e-Alam; status of an award',exam:true,
  hook:'Two doors: the courthouse, or a senior Shia jurist whose word is treated like an arbitrator’s award.',
  text:'<b>(7)</b> In case of dispute, the parties or any of the parties may have recourse to a court of competent jurisdiction or by approaching the Mujtahid-e-Alam from the panel maintained by the Council of Islamic Ideology. The decision of Mujtahid-e-Alam shall have a status of an award and the same shall be dealt with in accordance with the provisions of the Arbitration Act, 1940 (X of 1940).<br><b>Explanation.</b>&mdash;The expression “Mujtahid-e-Alam (Faqih-e-Azam)” means a juris-consult, religious scholar or doctor of Shia school of thought well versed with Shariah having international repute and of such recognition. The Council of Islamic Ideology shall maintain a panel of Mujtahid-e-Alam having aforesaid qualifications.',
  plain:[['the parties or any of the parties','either side may start it; consent of the other is not stated as a condition.'],['court of competent jurisdiction','the ordinary court with power over the matter; which court is not named.'],['status of an award','treated like an arbitrator’s decision and handled under the Arbitration Act, 1940.'],['panel maintained by the Council of Islamic Ideology','the Mujtahid-e-Alam is chosen from this panel.']],
  links:[['s.7 proviso (c): same mechanism','5:r2'],['s.3(2): Arbitration Act kept away from the Council','1:r8']],cases:[],
  bnd:'<h4>Boundary map: the two forums</h4><table><tr><th>Forum</th><th>Procedural law</th><th>Outcome</th></tr><tr><td>Court of competent jurisdiction</td><td>its own procedure</td><td>judgment or decree</td></tr><tr><td>Mujtahid-e-Alam</td><td>Arbitration Act, 1940</td><td>decision with the status of an award</td></tr><tr><td>Arbitration Council</td><td>not a forum under s.4</td><td>not applicable</td></tr></table>'},
 {id:'r8',code:'s.4(8)',term:'Jafri personal law decides Ahl-e-Tashih inheritance',sub:'Article 227, as the text itself recites',tests:'which personal law decides',
  hook:'The sub-section that hands Shia inheritance to Shia law, citing the Constitution as its warrant.',
  text:'<b>(8)</b> As enshrined in Article 227 of the Constitution of the Islamic Republic of Pakistan, the inheritance rights of Ahl-e-Tashih and matters connected therewith or ancillary thereto shall be decided according to their personal law interpreted by Fiqah-e-Jafria (Shia school of thought).]',
  plain:[['Article 227','the Constitution provision the sub-section itself relies on; its text was not read in this build.'],['matters connected therewith or ancillary thereto','things that follow from the inheritance rights, such as how shares are measured and paid.'],['their personal law … Fiqah-e-Jafria','Jafri law governs the inheritance rights of this group.']],
  links:[['s.4(1)','r1'],['s.4(2)','r2'],['s.7(1A): the same device for divorce','5:r3']],cases:[],
  bnd:'<h4>Boundary map: which sub-section governs a Shia estate</h4><table><tr><th>Question</th><th>Answer</th></tr><tr><td>Widow’s share (immovable, movable)</td><td>(2) to (5)</td></tr><tr><td>Husband’s share from the wife</td><td>(6)</td></tr><tr><td>Dispute</td><td>court or Mujtahid-e-Alam (7)</td></tr><tr><td>Other inheritance rights of Ahl-e-Tashih</td><td>Jafri law (8)</td></tr><tr><td>Orphaned grandchild in a Shia family: (1) or (8)?</td><td>the text does not say whether (8) displaces (1); open to argument; not checked</td></tr></table>'}
 ],
 spar:[
  {q:'Propositus P’s son B dies before P. B’s son C also dies before P, leaving a child G who is alive when P dies. Does G take B’s share under s.4(1)?',a:'On the Supreme Court’s March 2022 ruling as reported, no: s.4 covers children of the predeceased son or daughter who are “living at the time the succession opens”, and does not reach great-grandchildren. C is a grandchild but died before the opening, and G is a great-grandchild. Reported from news; the judgment text was not seen.'},
  {q:'A Shia husband dies without children. His two widows survive. A house was worth Rs 800 at his death and Rs 1,200 on the day the heirs pay. What does each widow receive?',a:'One-fourth of the value at the time of payment (s.4(2)(a), (4)): 1/4 of Rs 1,200 = Rs 300 in total, divided equally between two widows (s.4(3)): Rs 150 each. If the heirs do not pay, each is entitled to her due share in the corpus of the house (s.4(4) proviso).'},
  {q:'Cross-module: how do the widow’s s.4(2) share and an unpaid dower under s.10 interact?',a:'The text of s.4 does not mention dower. Section 10 only fixes the mode of payment where the nikah nama is silent. Whether an unpaid dower is a debt on the husband’s estate before the widow’s share is calculated is a question of general Muslim law, outside the Ordinance, and is not answered here.'},
  {q:'Cross-module: ss.4(7) and 7 proviso (c) both send disputes to a Mujtahid-e-Alam, while s.3(2) shuts the Arbitration Act out for the Arbitration Council. What explains the difference?',a:'The Arbitration Council is a statutory conciliation body formed under s.2(a); s.3(2) keeps court procedure laws away from it. The Mujtahid-e-Alam is an alternative decision-maker for Jafri disputes, whose decision “shall have a status of an award” and so is dealt with under the Arbitration Act, 1940. The Ordinance borrows the Act deliberately for one and excludes it for the other.'},
  {q:'Cross-section: a Shia family has a son who died before his father. Do you apply s.4(1) or s.4(8) to the son’s children?',a:'The text does not say. Sub-section (1) speaks of any son or daughter of the propositus; sub-section (8) assigns the inheritance rights of Ahl-e-Tashih to Jafri law. Whether (8) displaces (1) for Shia families is open to argument and is not checked against case law.'}
 ]
};

MD[3]={
 tag:'Module 3 · s.5 · Accordion',
 title:'Registration of marriage',
 intro:'Section 5 puts every Muslim marriage on paper. Three actors: the Union Council that licenses Nikah Registrars, the Registrar or other person who solemnizes, and the public who may inspect the record. One offence, one cross-reference to the Rules.',
 recall:'Every marriage is registered (1). One licensed Registrar per Ward at most (2). If someone else solemnizes, that person reports it to the Registrar (3). Failing to report: up to 3 months or Rs 1,000 (4). Form, registers and fees are left to the Rules (5). Anyone may inspect or copy the record (6).',
 rails:[
 {id:'r1',code:'s.5(1)',term:'Every marriage must be registered',sub:'The duty is on the marriage; non-registration does not by itself undo it',ess:'every marriage solemnized under Muslim Law',exam:true,
  hook:'A nikah is made in the room, but the Ordinance wants it written down in the register.',
  text:'<b>5. Registration of marriages.</b>&mdash;<b>(1)</b> Every marriage solemnized under Muslim Law shall be registered in accordance with the provisions of this Ordinance.',
  plain:[['solemnized under Muslim Law','performed by a valid Muslim-law nikah; the Ordinance registers marriages, it does not create them.'],['shall be registered','a duty, not an option.'],['in accordance with the provisions of this Ordinance','through the Nikah Registrar and the Union Council record (ss.5(2) to (5)); s.3(1) says registration may take place only this way.']],
  ex:'A couple marry before witnesses, with proper offer and acceptance, and nobody reports it. The nikah is not void for that reason; the person who solemnized it has broken s.5(3) and is exposed to s.5(4).',
  links:[['s.3(1) registration only under the Ordinance','1:r7'],['s.5(3) report','r3'],['s.5(4) penalty','r4'],['s.6(1): unpermitted second marriage not registered','4:r1']],
  cases:[
   {n:'Arif Hussain and Azra Parveen v The State',c:'Federal Shariat Court, PLD 1982 FSC 42',t:'Reported as holding that registration is not an essential condition for a valid nikah and that the Ordinance does not make an unregistered nikah invalid. A 2023 Islamabad Law Review article criticises its reasoning on proof of the marriage but accepts the general rule that non-registration attracts the s.5(4) penalty and does not by itself invalidate the marriage.',v:1,fl:'secondary article'}
  ],
  bnd:'<h4>Boundary map: validity against registration</h4><table><tr><th>Nikah</th><th>Registered?</th><th>Position</th></tr><tr><td>Valid</td><td>yes</td><td>compliant; registration gives the easiest proof of the marriage</td></tr><tr><td>Valid</td><td>no</td><td>marriage stands; the solemnizer who did not report is exposed to s.5(4)</td></tr><tr><td>Not valid under Muslim law</td><td>yes</td><td>registration does not create a marriage</td></tr><tr><td>Not valid</td><td>no</td><td>no marriage and nothing to register</td></tr><tr><td>Solemnized before 15 July 1961</td><td>either</td><td>text silent on past marriages; not checked</td></tr></table>'},
 {id:'r2',code:'s.5(2)',term:'Nikah Registrars: licensed by the Union Council, one per Ward',sub:'One or more persons may be licensed, but never more than one for any Ward',ess:'licence by the Union Council; at most one per Ward',exam:true,
  hook:'One ward, one registrar: the Ordinance does not let two scribes keep the same book.',
  text:'<b>(2)</b> For the purpose of registration of marriages under this Ordinance, the Union Council shall grant licences to one or more persons, to be called Nikah Registrars, but in no case shall more than on Nikah Registrar be licensed for any one Ward.',
  plain:[['Union Council','the local body in s.2(d); it, not the Provincial Government, grants the licence.'],['licences','a licence is a permission with conditions; a registrar who breaches it risks losing it.'],['more than on Nikah Registrar','printed so in the bare act (for “one”); read as “one”.'],['Ward','a ward within a Union or Town (s.2(e)).']],
  links:[['s.2(d), (e) Union Council, Ward','1:r6'],['s.5(5) records','r5']],
  cases:[
   {n:'Supreme Court on the role of Nikah Registrars (title not given in the reports)',c:'Supreme Court of Pakistan, reported 27 June 2025',t:'Reported as stressing that Registrars licensed under s.5(2) have the most important role in ensuring that the entries in the Nikahnama reflect the parties’ intention; the court asked the government to simplify the Nikahnama and to ensure that Registrars are qualified and of integrity.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: Registrars per Ward</h4><table><tr><th>Number licensed for a Ward</th><th>Under s.5(2)</th></tr><tr><td>0</td><td>not forbidden by the words, but the Ward would have no Registrar</td></tr><tr><td>1</td><td>allowed</td></tr><tr><td>2 or more</td><td>forbidden: “in no case”</td></tr></table><p>The limit is per Ward, not per Union Council: a Union with several Wards may have several Registrars, one for each. The text does not say whether one person may hold licences for two Wards.</p>'},
 {id:'r3',code:'s.5(3)',term:'Marriage not solemnized by the Registrar must be reported to him',sub:'The duty falls on the person who solemnized the marriage',ess:'reported to the Nikah Registrar; by the person who solemnized',exam:true,
  hook:'If the imam performs the nikah, the imam carries the paper.',
  text:'<b>(3)</b> Every marriage not solemnized by the Nikah Registrar shall, for the purpose of registration under this Ordinance, be reported to him by the person who has solemnized such marriage.',
  plain:[['not solemnized by the Nikah Registrar','another person (a cleric, a relative, an elder) performed the nikah.'],['reported to him','told to the Nikah Registrar so he can register it; the text sets no number of days.'],['the person who has solemnized','the person bound is the solemnizer, not the bride or groom.']],
  ex:'A cleric performs a nikah in a village hall. Under s.5(3) it is the cleric, not the couple, who must report it to the Registrar. If he does not, s.5(4) bites on him.',
  links:[['s.5(4) penalty','r4'],['s.5(2) Registrar','r2']],cases:[],
  bnd:'<h4>Boundary map: who solemnizes, who acts</h4><table><tr><th>Who solemnized</th><th>Who registers or reports</th></tr><tr><td>Nikah Registrar</td><td>the Registrar registers it (he is the Registrar)</td></tr><tr><td>Any other person</td><td>that person reports it to the Registrar (s.5(3))</td></tr><tr><td>Nobody reports</td><td>the solemnizer is exposed to s.5(4); the marriage itself is not undone on that ground alone</td></tr></table><p>The text does not say what the couple can do if the solemnizer will not report. Not answered.</p>'},
 {id:'r4',code:'s.5(4)',term:'Penalty for not reporting',sub:'Simple imprisonment up to three months, or fine up to Rs 1,000, or both',ess:'contravention of sub-section (3); up to 3 months or Rs 1,000',exam:true,
  hook:'A short sentence for a short omission: three months, a thousand rupees, or both.',
  text:'<b>(4)</b> Whoever contravenes the provisions of sub-section (3) shall be punishable with simple imprisonment for a term which may extent to three months, or with fine which may extend to one thousand rupees, or with both.',
  plain:[['contravenes the provisions of sub-section (3)','fails to report a marriage he solemnized to the Registrar.'],['simple imprisonment','the lighter kind, without hard labour.'],['may extent … may extend','ceilings, not minimums; “extent” is a misprint in the bare act.']],
  links:[['s.5(3)','r3'],['s.7(2) penalty for no notice of talaq','5:r4'],['s.6(5)(b) polygamy penalty','4:r6'],['s.11(2) breach of rules','9:r2']],cases:[],
  bnd:'<h4>Boundary map: penalties in the Ordinance (bare act, updated to 10-3-2022)</h4><table><tr><th>Provision</th><th>Offence</th><th>Ceiling</th></tr><tr><td>s.5(4)</td><td>not reporting a marriage</td><td>3 months or Rs 1,000 or both</td></tr><tr><td>s.6(5)(b)</td><td>second marriage without permission</td><td>1 year or Rs 5,000 or both</td></tr><tr><td>s.7(2)</td><td>no notice of talaq</td><td>1 year or Rs 5,000 or both</td></tr><tr><td>s.11(2)</td><td>breach of rules (if rules so provide)</td><td>1 month or Rs 200 or both</td></tr></table><p>A Punjab Police compilation (undated, amending Act not named) shows a different s.5: an added sub-section (2A) obliging the Registrar or solemnizer to complete the nikah nama accurately, and a larger fine in s.5(4) (Rs 100,000 as printed there). Those figures are not in the bare act used here and are not verified; treat the table above as the federal text.</p>'},
 {id:'r5',code:'s.5(5)',term:'Form, registers, records, copies and fees: left to the Rules',sub:'“As may be prescribed”: the detail is in the Rules under s.11',tests:'what the Ordinance leaves to the Rules',
  hook:'The Ordinance sketches the register; the Rules ink it in.',
  text:'<b>(5)</b> The form of nikah nama, the registers to be maintained by Nikah Registrars, the records to be preserved by Union Councils, the manner in which marriages shall be registered and copies of nikah nama shall be supplied to the parties and the fees to be charged thereof, shall be such as may be prescribed.',
  plain:[['nikah nama','the marriage deed in the prescribed form; its dower and special-condition columns feed ss.6, 8 and 10.'],['records preserved by Union Councils','each Union Council keeps the register, so s.5(6) inspection is at its office.'],['as may be prescribed','fixed by rules under s.11 (s.2(c)).']],
  links:[['s.2(c) prescribed','1:r6'],['s.11 rules','9:r1'],['s.10 dower and the nikah nama','8:r2'],['s.5(6) inspection','r6']],
  cases:[
   {n:'Supreme Court directions on completing the Nikahnama (title not given in the reports)',c:'Supreme Court of Pakistan, five-judge bench headed by Shahid Waheed J, 22 September 2026',t:'Reported as directing Registrars to use the prescribed Nikahnama and fill every relevant column, leaving none blank without lawful basis; to read the dower, special-condition and delegated-talaq entries to the parties before signing; and to give copies and forward one to the Union Council.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: what s.5(5) leaves to the Rules</h4><table><tr><th>Item</th><th>Left to the Rules</th></tr><tr><td>Form of the nikah nama</td><td>yes</td></tr><tr><td>Registers kept by Registrars</td><td>yes</td></tr><tr><td>Records kept by Union Councils</td><td>yes</td></tr><tr><td>Manner of registering</td><td>yes</td></tr><tr><td>Supply of copies to the parties</td><td>yes</td></tr><tr><td>Fees</td><td>yes</td></tr><tr><td>Who must register and the penalty</td><td>no: in the Ordinance (ss.5(1), (3), (4))</td></tr></table>'},
 {id:'r6',code:'s.5(6)',term:'Public inspection and copies',sub:'Any person, on payment of the prescribed fee, if any',tests:'who may inspect the register',
  hook:'The marriage register is a public book: anyone can read it for the price of a fee.',
  text:'<b>(6)</b> Any person may, on payment of the prescribed fee, if any, inspect at the office of the Union Council the record preserved under sub-section (5), or obtain a copy of any entry therein.',
  plain:[['any person','no interest need be shown on the words of the text.'],['prescribed fee, if any','the Rules may set a fee or none.'],['record preserved under sub-section (5)','the Union Council’s register of marriages.']],
  links:[['s.5(5)','r5']],cases:[],
  bnd:'<h4>Boundary map: access to the register</h4><table><tr><th>Who</th><th>Right under s.5(6)</th></tr><tr><td>Husband or wife</td><td>yes (and copies under s.5(5))</td></tr><tr><td>A stranger</td><td>yes: “any person”</td></tr><tr><td>A court</td><td>not dealt with in s.5(6); court process is separate</td></tr></table>'}
 ],
 spar:[
  {q:'A village cleric performs a nikah, nobody informs the Registrar, and two years later the husband denies the marriage. Is the nikah valid, who committed an offence, and what is the maximum punishment?',a:'The nikah is not made invalid merely by non-registration (Arif Hussain v The State, PLD 1982 FSC 42, as reported). The person who solemnized it breached s.5(3) and is punishable under s.5(4) with simple imprisonment up to three months, a fine up to Rs 1,000, or both. Proof of the marriage is a separate question; the register would have been the easy proof.'},
  {q:'The Union Council licenses two Nikah Registrars for the same Ward. Is that allowed, and what if it licenses one person for two Wards?',a:'Two for one Ward is forbidden: “in no case shall more than [one] Nikah Registrar be licensed for any one Ward” (s.5(2)). One person for two Wards is not addressed by the words; the limit is per Ward. Open to argument.'},
  {q:'Cross-module: s.6(1) says an unpermitted second marriage “shall not be registered under this Ordinance”, while s.5(1) says every Muslim marriage must be registered. How do you reconcile them?',a:'Read together, s.6(1) is a specific bar on registration for the unpermitted marriage, and s.5(1) is the general duty. The solemnizer’s duty to report in s.5(3) is expressed for any marriage not solemnized by the Registrar and is not limited by s.6(1) in terms. The text does not settle how the two interact; open to argument.'},
  {q:'Cross-module: a nikah nama leaves the dower column blank. Which section fills the gap, and how does the Supreme Court’s 2026 direction to Registrars (as reported) bear on it?',a:'Section 10: where no details about the mode of payment of dower are specified in the nikah nama or marriage contract, the entire dower is payable on demand. The reported 2026 directions tell Registrars not to leave dower columns blank without lawful basis, so the gap should arise less often. See Module 8.'}
 ]
};

MD[4]={
 tag:'Module 4 · s.6 · Gate',
 title:'Polygamy',
 intro:'A man who already has a wife needs the Arbitration Council’s written permission before taking another. The gate walks one case from the existing marriage to the consequences; the rails give the text of each sub-section.',
 recall:'Existing marriage + another marriage = permission first (1). Apply to the Chairman, state reasons and whether the wife consented (2). Council with a nominee from each side decides “necessary and just” (3). Reasons recorded; revision to the Collector is final (4). Without permission: dower due at once, plus up to a year or Rs 5,000 (5).',
 rails:[
 {id:'r1',code:'s.6(1)',term:'No further marriage without the Council’s written permission',sub:'During an existing marriage; unpermitted marriage may not be registered',ess:'subsisting marriage; previous written permission; Arbitration Council',exam:true,
  hook:'Permission first, wedding second: the order is part of the rule.',
  text:'<b>6. Polygamy.</b>&mdash;<b>(1)</b> No man, during the subsistence of an existing marriage, shall, except with the previous permission in writing of the Arbitration Council, contract another marriage, nor shall any such marriage contracted without such permission be registered under this Ordinance.',
  plain:[['subsistence of an existing marriage','while a marriage is still in force. A talaq pronounced but not yet effective under s.7(3) has not ended it.'],['previous permission in writing','permission obtained before the marriage and recorded on paper.'],['Arbitration Council','see s.2(a): the Chairman and a nominee of each side.'],['contract another marriage','any further marriage: the section does not say second, third or fourth.']],
  ex:'A man pronounces talaq on his wife and, thirty days later, marries again, before giving the Chairman notice or waiting out the ninety days. His first marriage has not ended (s.7(3)), so his new marriage is “another marriage” during the subsistence of an existing one, and s.6(1) is engaged. Reading from the two sections together; not tested in a case.',
  links:[['s.6(2) application','r2'],['s.6(5) consequences','r5'],['s.7(3): when an existing marriage ends','5:r5'],['s.5(1) registration','3:r1'],['s.2(a) Council','1:r4']],
  cases:[
   {n:'Dilshad Bibi v her husband (named Liaqat Ali Mir in some reports, Muzaffar Mir in another)',c:'Islamabad High Court, June 2019, Athar Minallah CJ',t:'Reported as holding that the Arbitration Council’s permission is compulsory, and that a first wife’s consent alone does not replace it: a man who remarries without the Council’s permission is liable to punishment even if the first wife agreed. The Council must weigh the factors in ss.6(2) to (4) and cannot grant permission mechanically. A sentence of one month and Rs 5,000 was reported; the case was remitted for rehearing.',v:1,fl:'news report'},
   {n:'Appeal against a Peshawar High Court order for immediate payment of dower (title not given)',c:'Supreme Court of Pakistan, reported 26 August 2020',t:'Reported in a news snippet as noting that s.6 prohibits a second marriage without the Arbitration Council’s prior written permission. Only the snippet was read.',v:1,fl:'news snippet'},
   {n:'Second marriage without first wife’s consent (titles not given)',c:'Supreme Court of Pakistan, reported October 2025 and March 2026',t:'Reported as holding that a husband’s second marriage without the first wife’s consent is a valid ground on which she may seek dissolution, and as warning that a man who remarries without her consent or the Council’s approval may face both civil and criminal proceedings.',v:1,fl:'news report'},
   {n:'Petition challenging section 6 (title not given)',c:'Islamabad High Court, Athar Minallah CJ, date not stated in the report',t:'Reported as dismissing a petition by a woman who wanted to become a third wife and challenged s.6.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: marriage count and the state of the existing marriage</h4><table><tr><th>Facts</th><th>s.6(1) engaged?</th></tr><tr><td>First marriage (no existing marriage)</td><td>no</td></tr><tr><td>Second marriage (one wife)</td><td>yes</td></tr><tr><td>Third marriage (two wives)</td><td>yes: permission needed again</td></tr><tr><td>Fourth marriage (three wives)</td><td>yes</td></tr><tr><td>Fifth or later</td><td>text sets no cap; any limit lies outside the Ordinance</td></tr><tr><td>Talaq effective under s.7</td><td>no: the marriage has ended</td></tr><tr><td>Talaq pronounced, still inside the ninety days (or the pregnancy)</td><td>yes: marriage still subsists</td></tr><tr><td>Talaq revoked</td><td>yes: marriage continues</td></tr><tr><td>Wife dead</td><td>no existing marriage with her; text silent on others</td></tr></table>'},
 {id:'r2',code:'s.6(2)',term:'The application to the Chairman',sub:'Prescribed manner and fee; reasons; whether the existing wife or wives consented',ess:'application to the Chairman; reasons; statement of consent',exam:true,
  hook:'Three things go in the envelope: the fee, the reasons, and a line on whether the first wife said yes.',
  text:'<b>(2)</b> An application for permission under sub-section (1) shall be submitted to the Chairman in the prescribed manner, together with the prescribed fee, and shall state reasons for the proposed marriage, and whether the consent of the existing wife or wives has been obtained thereto.',
  plain:[['prescribed manner … prescribed fee','set by the Rules under s.11.'],['state reasons','the applicant must say why he wants to marry again.'],['whether the consent of the existing wife or wives has been obtained','he must state whether she consented, yes or no; the words do not make consent a condition.']],
  links:[['s.6(1)','r1'],['s.6(3) Council','r3'],['s.2(b) Chairman','1:r5'],['s.11 Rules','9:r1']],
  cases:[
   {n:'Dilshad Bibi v her husband (IHC, June 2019)',c:'Islamabad High Court, Athar Minallah CJ',t:'Reported as stressing that, contrary to popular belief, the first wife’s consent is not the only requirement: the Council’s approval is compulsory as well.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: the wife’s consent against the Council’s permission</h4><table><tr><th>First wife</th><th>Council permission</th><th>Result</th></tr><tr><td>consents</td><td>granted</td><td>lawful under s.6(1)</td></tr><tr><td>consents</td><td>not obtained</td><td>offence: consent does not replace permission (IHC 2019, as reported)</td></tr><tr><td>does not consent</td><td>granted</td><td>reading: permission is valid on the words, since consent is a fact to be stated, not a condition; the wife can use the revision in s.6(4)</td></tr><tr><td>does not consent</td><td>not obtained</td><td>offence; dower due at once; the wife may also seek dissolution on the reported Supreme Court view</td></tr></table>'},
 {id:'r3',code:'s.6(3)',term:'Constituting the Council; “necessary and just”',sub:'Applicant and each existing wife nominate a representative; permission may carry conditions',ess:'Council with a nominee of each side; satisfied the marriage is necessary and just',exam:true,
  hook:'The law asks two questions, not one: is the second marriage necessary, and is it just?',
  text:'<b>(3)</b> On receipt of the application under sub-section (2), the Chairman shall ask the applicant and his existing wife or wives each to nominate a representative, and the Arbitration Council so constituted may, if satisfied that the proposed marriage is necessary and just, grant, subject to such conditions, if any, as may be deemed fit, the permission applied for.',
  plain:[['each to nominate a representative','the applicant and every existing wife name one nominee each.'],['may, if satisfied','the Council has a discretion; it is not bound to grant.'],['necessary and just','both words must be met; the Ordinance gives no list of grounds, so commonly cited grounds such as infirmity or childlessness are not in this text (check the Rules in Module 9).'],['subject to such conditions','the Council may attach conditions to the permission.']],
  links:[['s.2(a) proviso: party names no nominee','1:r4'],['s.6(4) reasons and revision','r4'],['s.6(2)','r2']],
  cases:[
