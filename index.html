  ],
  bnd:'<h4>Boundary map: who sits and what the Council decides</h4><table><tr><th>Member</th><th>Role</th></tr><tr><td>Chairman</td><td>constitutes the Council on receipt of the application</td></tr><tr><td>Applicant’s nominee</td><td>one</td></tr><tr><td>Each existing wife’s nominee</td><td>one for each wife</td></tr><tr><td>A party names no nominee in time</td><td>body formed without that representative is still the Council (s.2(a))</td></tr></table><table><tr><th>Council finding</th><th>Effect</th></tr><tr><td>Satisfied: necessary and just</td><td>may grant, with or without conditions</td></tr><tr><td>Satisfied on one limb only</td><td>not enough on the words: both are required</td></tr><tr><td>Not satisfied</td><td>no permission; reasons recorded; revision available</td></tr></table>'},
 {id:'r4',code:'s.6(4)',term:'Reasons and revision to the Collector',sub:'Any party may seek revision; the Collector’s decision is final',ess:'reasons recorded; revision to the Collector; finality',exam:true,
  hook:'Say why, and if someone disagrees there is one more door: the Collector, whose word is the last.',
  text:'<b>(4)</b> In deciding the application the Arbitration Council shall record its reasons for the decision, and any party may, in the prescribed manner, within the prescribed period, and on payment of the prescribed fee, prefer an application for revision, to the Collector concerned and his decision shall be final and shall not be called in question in any Court.',
  plain:[['record its reasons','a written statement of why it granted or refused.'],['any party','the applicant or an existing wife, whichever is aggrieved.'],['Collector','an officer; “to the Collector” replaced earlier words by F.A.O. 1975 (printed footnote).'],['final … not be called in question in any Court','the text excludes court challenge; how far that holds against constitutional jurisdiction is outside the Ordinance and not checked.']],
  links:[['s.6(3)','r3'],['s.9(2): the same device for maintenance','7:r2']],cases:[],
  bnd:'<h4>Boundary map: after the Council decides</h4><table><tr><th>Outcome</th><th>Who may seek revision</th><th>Final?</th></tr><tr><td>Permission granted</td><td>an existing wife (or other party)</td><td>Collector’s decision final</td></tr><tr><td>Permission refused</td><td>the applicant</td><td>Collector’s decision final</td></tr><tr><td>No revision sought</td><td>nobody</td><td>Council’s decision stands</td></tr><tr><td>Revision out of time or unpaid fee</td><td>not within the prescribed conditions</td><td>depends on the Rules</td></tr></table>'},
 {id:'r5',code:'s.6(5)(a)',term:'Dower becomes payable at once',sub:'Entire dower, prompt or deferred, due to the existing wife or wives; recoverable as arrears of land revenue',ess:'entire dower, prompt or deferred; immediately',exam:true,
  hook:'Marry without permission and the bill for every wife’s dower arrives on the same day.',
  text:'<b>(5)</b> Any man who contracts another marriage without the permission of the Arbitration Council shall&mdash;<br><b>(a)</b> pay immediately the entire amount of the dower, whether prompt or deferred, due to the existing wife or wives, which amount, if not so paid, shall be recoverable as arrears of land revenue; and',
  plain:[['entire amount of the dower','all of it, including the part the nikah nama said was payable later.'],['prompt or deferred','prompt is payable on demand; deferred is payable at a stated later event. Both become due at once.'],['existing wife or wives','every wife already married to him, each for her own dower.'],['arrears of land revenue','recovered by the revenue machinery, like unpaid land revenue.']],
  ex:'A man has two wives with dower of Rs 100,000 each, half prompt and half deferred until divorce or death. He marries a third time without permission. Both wives’ full Rs 100,000 becomes payable now.',
  links:[['s.10 dower, unspecified mode','8:r1'],['s.6(5)(b) penalty','r6'],['s.6(1)','r1']],
  cases:[
   {n:'Appeal against a Peshawar High Court order for immediate payment of dower (title not given)',c:'Supreme Court of Pakistan, reported 26 August 2020',t:'The appeal arose from a Peshawar High Court order directing a man to pay his first wife’s dower immediately after a second marriage without permission. The snippet read does not give the outcome in full.',v:1,fl:'news snippet'}
  ],
  bnd:'<h4>Boundary map: dower types against s.6(5)(a)</h4><table><tr><th>Dower</th><th>Normal time of payment</th><th>After an unpermitted marriage</th></tr><tr><td>Prompt (mu’ajjal)</td><td>on demand</td><td>due immediately</td></tr><tr><td>Deferred (mu’wajjal)</td><td>stated later event</td><td>due immediately</td></tr><tr><td>Mode unspecified (s.10)</td><td>on demand</td><td>due immediately</td></tr><tr><td>Already paid</td><td>nothing outstanding</td><td>nothing further</td></tr></table>'},
 {id:'r6',code:'s.6(5)(b)',term:'Criminal penalty, on complaint',sub:'Simple imprisonment up to one year, or fine up to Rs 5,000, or both',ess:'conviction upon complaint; 1 year or Rs 5,000 or both',exam:true,
  hook:'The criminal case starts with a complaint, not with the police: someone has to bring it.',
  text:'<b>(b)</b> on conviction upon complaint be punishable with simple imprisonment which may extend to one year, or with fine which may extend to five thousand rupees, or with both.',
  plain:[['upon complaint','the prosecution is started by a complaint; the text does not say who may file it.'],['simple imprisonment','the lighter kind, without hard labour.'],['may extend','ceilings, not minimums.']],
  links:[['s.6(5)(a)','r5'],['s.5(4), s.7(2): other penalties','3:r4']],
  cases:[
   {n:'Dilshad Bibi v her husband (IHC, June 2019)',c:'Islamabad High Court, Athar Minallah CJ',t:'A sentence of one month’s imprisonment and a fine of Rs 5,000 was reported, within the ceilings of s.6(5)(b).',v:1,fl:'news report'},
   {n:'Family-court convictions in Lahore (titles not given)',c:'reported by Nukta, November 2024, including a Lahore High Court bail refusal in 2022 (Ghulam Hussain)',t:'Reports describe sentences of six and seven months with a fine of Rs 500,000. That fine is far above the Rs 5,000 ceiling in the bare act; a Punjab Police compilation does show a Rs 500,000 fine in s.6 as amended, so the reports probably reflect a Punjab amendment (amending Act not identified). Not resolved.',v:1,fl:'news report'}
  ],
  bnd:'<h4>Boundary map: ceilings, federal text against the Punjab compilation</h4><table><tr><th>Source</th><th>Imprisonment</th><th>Fine</th></tr><tr><td>Bare act used here (updated to 10-3-2022)</td><td>up to 1 year</td><td>up to Rs 5,000</td></tr><tr><td>Punjab Police compilation (undated)</td><td>up to 1 year</td><td>up to Rs 500,000</td></tr><tr><td>IHC 2019 report</td><td>1 month</td><td>Rs 5,000</td></tr><tr><td>Lahore family-court reports</td><td>6 to 7 months</td><td>Rs 500,000</td></tr></table><p>The two ceilings cannot both be the law in the same place and time. Which applies depends on the amending Act and its territorial reach, which this build has not traced.</p>'}
 ],
 spar:[
  {q:'A man pronounces talaq on his first wife on 1 March and marries again on 15 March, without the Council’s permission. Is s.6 engaged?',a:'On the reading in this app, yes: his first marriage has not ended, because a talaq is not effective until ninety days after notice is delivered (s.7(3)). So he contracts “another marriage” during an existing one, and s.6(5) applies: dower due at once and the criminal penalty. A reading from two sections, not tested in a case.'},
  {q:'The first wife consents in writing to her husband’s second marriage, but he never applies to the Chairman. Is the marriage lawful?',a:'No. The wife’s consent is one fact the application must state (s.6(2)); permission comes from the Arbitration Council (s.6(1)). The Islamabad High Court (June 2019, as reported) held that the Council’s permission is compulsory even where the first wife agrees.'},
  {q:'Cross-module: compare s.6(5)(a) with s.10. A nikah nama gives a dower of Rs 200,000 and says nothing about when it is payable. The husband marries again without permission. When is the dower due, and by which section?',a:'Under s.10, with no mode of payment specified, the entire dower is payable on demand. Under s.6(5)(a), on an unpermitted second marriage the entire dower, prompt or deferred, becomes payable immediately. So it is due at once under s.6(5)(a) in any event. Section 10 matters for the earlier period.'},
  {q:'Cross-module: compare s.6 with s.7(6). Which requires a prior permission and which a prior marriage by the wife to someone else, and in each case what is the thing that stops the man?',a:'Section 6(1) requires the Arbitration Council’s previous written permission before a man marries again during an existing marriage. Section 7(6) says that after a third effective talaq between the same two people the wife cannot remarry the same husband without an intervening marriage with a third person. The first is a permission from a body; the second is a marriage by the woman to someone else.'},
  {q:'The reports speak of fines of Rs 500,000 for a second marriage without permission, while the bare act says Rs 5,000. How would you handle the discrepancy in an answer?',a:'State the bare-act ceiling (Rs 5,000) and say a later or provincial text may differ. A Punjab Police compilation shows Rs 500,000, but the amending Act has not been traced. Flag it as unresolved rather than choosing one figure.'}
 ]
};
MD[4].gate={title:'Walk a case through s.6',timeline:false,steps:[
 {id:'exist',t:'Is a marriage already subsisting?',ref:'s.6(1)',q:'Is the man in an existing marriage at the time of the proposed marriage? (A talaq pronounced but not yet effective under s.7(3) still counts as subsisting.)',
  y:{n:'Existing marriage: any further marriage needs the Arbitration Council’s previous written permission. The Ordinance sets no cap on the number of wives; each further marriage meets the same test.'},
  n:{n:'No existing marriage.',end:'No marriage subsists, so s.6(1) is not engaged: this is a first marriage, or a marriage after the earlier one has ended. An earlier marriage ends when a talaq becomes effective under s.7; a talaq still inside its ninety days has not ended it (s.7(3)).'}},
 {id:'apply',t:'Written application to the Chairman',ref:'s.6(2)',q:'Has the man applied to the Chairman in the prescribed manner, with the fee, stating reasons and whether the existing wife or wives consented?',
  y:{n:'Application made. It must state reasons and whether the existing wife’s consent has been obtained. The text asks for a statement of consent, not for consent as a condition.'},
  n:{n:'No application, so no permission can exist. Skipping to whether he married anyway.',go:'did'}},
 {id:'council',t:'Council constituted with a nominee from each side',ref:'s.6(3), s.2(a)',q:'Did the Chairman ask the applicant and each existing wife to nominate a representative, and was the Arbitration Council constituted?',
  y:{n:'Council constituted. If a party named no representative within the prescribed time, the body formed without that representative is still the Council (s.2(a) proviso).'},
  n:{n:'No Council constituted.',end:'Without a constituted Council there is no permission, and the text gives the applicant no remedy against a Chairman who does nothing: the revision in s.6(4) is against the Council’s decision. If the man marries anyway, s.6(5) applies: the entire dower due to the existing wife or wives is payable at once, and he is liable on conviction upon complaint to simple imprisonment up to one year, or a fine up to Rs 5,000, or both (bare act). What an applicant can do about inaction is not answered by the text; open to argument.'}},
 {id:'sat',t:'Council satisfied: “necessary and just”',ref:'s.6(3)',q:'Is the Arbitration Council satisfied that the proposed marriage is necessary and just, and does it grant permission (subject to any conditions)?',
  y:{n:'Permission granted, in writing, subject to any conditions. Reasons must be recorded (s.6(4)).',go:'did'},
  n:{n:'Not satisfied: permission refused. Reasons must be recorded, and any party may seek revision.'}},
 {id:'rev',t:'Revision to the Collector',ref:'s.6(4)',q:'Did a party seek revision to the Collector, and did the Collector’s decision leave the applicant with permission?',
  y:{n:'The Collector’s decision leaves permission in place. It is final and cannot be called in question in any court (text of s.6(4)).'},
  n:{n:'No permission after the Council’s decision (no revision sought, or the Collector did not grant it).'}},
 {id:'did',t:'Further marriage contracted',ref:'s.6(1), s.6(5)',q:'Did the man contract the further marriage?',
  y:{n:'Marriage contracted. The outcome depends on whether permission existed at that moment.'},
  n:{n:'No further marriage contracted.',end:'No further marriage was contracted, so s.6(5) is not engaged. Permission, if granted, is a permission and not a duty. Whether the existing marriage ends is a separate matter (Module 5).'}}
 ],
 final:function(m){
  var perm=m.sat==='y'||m.rev==='y';
  if(perm)return 'Marriage contracted with the Arbitration Council’s previous written permission: lawful under s.6(1), and it may be registered under the Ordinance (s.6(1) bars registration only of a marriage contracted without permission). Any conditions attached to the permission must be met.';
  return 'Marriage contracted without the Arbitration Council’s previous written permission. Consequences under s.6(5): (a) the entire dower, prompt or deferred, due to the existing wife or wives is payable immediately, and if unpaid is recoverable as arrears of land revenue; (b) on conviction upon complaint, simple imprisonment up to one year, or a fine up to Rs 5,000, or both (bare act; a Punjab compilation shows a larger fine). The marriage may not be registered under the Ordinance (s.6(1)). The Islamabad High Court (2019, as reported) held that the first wife’s consent alone does not replace the Council’s permission, and the Supreme Court (reported 2025 and 2026) has treated a second marriage without her consent as a ground on which she may seek dissolution.';
 }};

MD[5]={
 tag:'Module 5 · s.7 · Gate',
 title:'Talaq',
 intro:'Section 7 runs on the date the notice reaches the Chairman, not the date of pronouncement. Use the gate to walk one case through the section, then open the rails for the text of each sub-section.',
 recall:'Notice in writing to the Chairman after pronouncement, copy to the wife (1). No notice: up to a year or Rs 5,000 (2). Effective 90 days after notice is delivered, unless revoked earlier (3). Chairman forms the Council within 30 days (4). Pregnant wife: the later of the 90 days and the end of pregnancy (5). Third effective talaq: no remarriage without an intervening marriage (6). Jafri provisions in the proviso and (1A).',
 rails:[
 {id:'r1',code:'s.7(1)',term:'Notice of talaq to the Chairman',sub:'Any form of pronouncement; written notice; copy to the wife',ess:'notice to the Chairman',exam:true,
  hook:'Saying it is not enough: the law starts its clock only when the paper reaches the Chairman.',
  text:'<b>(1)</b> Any man who wishes to divorce his wife shall, as soon as may be after the pronouncement of talaq in any form whatsoever, give the Chairman notice in writing of his having done so, and shall supply a copy thereof to the wife:',
  plain:[['in any form whatsoever','whatever words or manner the husband used.'],['as soon as may be','promptly; the sub-section fixes no number of days.'],['Chairman','the Union Council Chairman, or a person appointed under s.2(b) to do the Chairman’s work.'],['notice in writing','a written statement, not an oral report.']],
  links:[['s.7(2) penalty','r4'],['s.7(3) 90-day rule','r5'],['proviso (Jafri)','r2']],
  cases:[
   {n:'Muhammad Hassan Sultan v Chairman Union Council, Cantonment Board Office, Karachi and another (Morial Shah)',c:'Supreme Court of Pakistan, Nov 2025, Civil Petition No. 5364 of 2024; three-member bench (CJ Yahya Afridi, Shafi Siddiqui J, Miangul Hassan Aurangzeb J)',t:'Section 7 applies to every form of talaq, including talaq-e-bidat; no talaq takes effect before the 90 days run; a wife holding an unconditional delegated right could withdraw her notice within the 90 days. Appeal from Sindh High Court, 7 Oct 2024 (C.P. S-525/2024), dismissed.',v:1},
   {n:'Syed Ali Nawaz Gardezi v Lt Col Muhammad Yusuf',c:'Supreme Court of Pakistan',t:'PLD 1963 SC 51. Citation confirmed. A secondary article (Islamabad Law Review, 2023) reports that it held the Ordinance reaches a marriage between a Pakistani Muslim man and a non-citizen Muslim or non-Muslim woman (see s.1(2)). The older note that it treats notice to the Chairman as mandatory for a talaq to take effect was not traced; later authority is said to have moved away from it.',v:2}
  ],
  bnd:'<h4>Boundary map: what the husband did against what s.7(1) asks</h4><table><tr><th>Facts</th><th>Position on the words</th></tr><tr><td>Pronounced in any form, written notice to the Chairman, copy to the wife</td><td>compliant; the ninety days run from delivery of the notice (s.7(3))</td></tr><tr><td>Written notice to the Chairman, no copy to the wife</td><td>the sub-section requires the copy; what that omission does to the clock is not stated</td></tr><tr><td>Oral report to the Chairman</td><td>not “notice in writing”</td></tr><tr><td>No notice at all</td><td>s.7(2) penalty; the clock in s.7(3) starts from delivery of notice, so open to argument whether the talaq ever takes effect (Gardezi line against later authority)</td></tr><tr><td>Talaq-e-bidat (three at once)</td><td>reported as caught by s.7 (Hassan Sultan, Supreme Court, Nov 2025; news and judgment text)</td></tr></table>'},
 {id:'r2',code:'s.7(1) proviso',term:'Fiqah-e-Jafria: how talaq must be pronounced',sub:'Arabic words, two witnesses, free will; disputes to court or Mujtahid-e-Alam',tests:'valid pronouncement (Jafri)',
  hook:'Same notice rule, stricter pronouncement: for Jafri couples the words, the witnesses and the state of mind all count.',
  text:'Provided that where the parties belong to Fiqah-e-Jafria,&mdash;<br><b>(a)</b> the man may voluntarily and with his free will pronounce himself or through duly authorized attorney (Vakil) Talaq uttering in literal Arabic words (seegha) in the physical presence of at least two witnesses qualifying the requirements of clause (1) of Article 17 of the Qanun-e-Shahadat, 1984 (P.O. No. 1 of 1984);<br><b>(b)</b> the pronouncement of Talaq shall be ineffective if it is done jokingly or under anger, intoxication, insanity, duress or coercion of any kind and from any corner whatsoever; and<br><b>(c)</b> in case of dispute, with reference to clauses (a) or (b) arising due to difference of opinion, the parties or any of the parties may have recourse to a court of competent jurisdiction or by approaching the “Mujtahid-e-Alam” and the decision of Mujtahid-e-Alam shall have a status of an award and the same shall be dealt with in accordance with the provisions of the Arbitration Act, 1940 (X of 1940).<br><b>Explanation.</b>&mdash;The expression “Mujtahid-e-Alam (Faqih-e-Azam)” means a juris-consult, religious scholar or doctor of Shia school of thought well versed with Shariah having international repute and of such recognition. The Council of Islamic Ideology shall maintain a panel of Mujtahid-e-Alam having aforesaid qualifications.',
  plain:[['seegha','the prescribed Arabic wording of the pronouncement.'],['Vakil','an authorised attorney; the husband may pronounce through one.'],['Mujtahid-e-Alam','a senior Shia jurist on the Council of Islamic Ideology’s panel.'],['status of an award','his decision is treated like an arbitration award and handled under the Arbitration Act, 1940.']],
  links:[['s.7(1)','r1'],['s.7(1A)','r3']],
  cases:[],
  bnd:'<h4>Boundary map: states at pronouncement</h4><table><tr><th>Condition</th><th>Effect under clause (b)</th></tr><tr><td>Jokingly</td><td>ineffective</td></tr><tr><td>Under anger</td><td>ineffective</td></tr><tr><td>Intoxication</td><td>ineffective</td></tr><tr><td>Insanity</td><td>ineffective</td></tr><tr><td>Duress or coercion</td><td>ineffective</td></tr><tr><td>Free will, Arabic words, two witnesses</td><td>required by clause (a)</td></tr></table><p>The proviso was substituted and inserted by Act XXIX of 2021 (per the printed footnote).</p>'},
 {id:'r3',code:'s.7(1A)',term:'Jafri personal law decides divorce',sub:'Article 227, as the text itself recites',tests:'which personal law decides',
  hook:'One sentence that hands Jafri divorce to Jafri law.',
  text:'<b>(1A)</b> As enshrined in Article 227 of the Constitution of the Islamic Republic of Pakistan, the divorce and matters connected therewith or ancillary thereto shall be decided according to the personal law interpreted by Fiqah-e-Jafria (Shia school of thought).',
  plain:[['ancillary','connected with, and following from, the divorce itself.'],['Article 227','the Constitution provision the sub-section itself relies on; read it in the Constitution (not yet checked in this build).']],
  links:[['proviso (Jafri)','r2'],['s.7(1)','r1']],cases:[],
  bnd:'<h4>Boundary map: whom s.7(1A) reaches</h4><table><tr><th>Parties</th><th>Divorce decided by</th></tr><tr><td>Both Fiqah-e-Jafria</td><td>that personal law, as interpreted by it (s.7(1A) and the proviso)</td></tr><tr><td>Both Sunni (or other)</td><td>not within (1A); the main s.7 sequence applies</td></tr><tr><td>Parties of different schools</td><td>the text is silent; open to argument</td></tr></table>'},
 {id:'r4',code:'s.7(2)',term:'Penalty for no notice',sub:'Simple imprisonment up to one year, or fine up to Rs 5,000, or both',tests:'consequence of contravening s.7(1)',
  hook:'Skip the notice, risk a year.',
  text:'<b>(2)</b> Whoever contravenes the provisions of sub-section (1) shall be punishable with simple imprisonment for a term which may extend to one year or with fine which may extend to five thousand rupees or with both.',
  plain:[['simple imprisonment','the lighter kind of imprisonment, without hard labour.'],['may extend','a ceiling, not a minimum.'],['contravenes sub-section (1)','fails to give the Chairman written notice, or fails to supply the wife a copy.']],
  links:[['s.7(1)','r1'],['s.7(3)','r5']],cases:[],
  bnd:'<h4>Boundary map: penalties across the Ordinance</h4><table><tr><th>Provision</th><th>Offence</th><th>Ceiling</th></tr><tr><td>s.5(4)</td><td>not reporting a marriage</td><td>3 months or Rs 1,000 or both</td></tr><tr><td>s.6(5)(b)</td><td>second marriage without permission</td><td>1 year or Rs 5,000 or both</td></tr><tr><td>s.7(2)</td><td>no notice of talaq</td><td>1 year or Rs 5,000 or both</td></tr><tr><td>s.11(2)</td><td>breach of rules (if rules so provide)</td><td>1 month or Rs 200 or both</td></tr></table>'},
 {id:'r5',code:'s.7(3)',term:'The 90-day rule',sub:'Not effective until ninety days after notice is delivered, unless revoked',ess:'90 days, no revocation',exam:true,
  hook:'Pronounced is not divorced: the marriage survives until ninety days after the notice lands.',
  text:'<b>(3)</b> Save as provided in sub-section (5), a talaq unless revoked earlier, expressly or otherwise shall not be effective until the expiration of ninety days from the day on which notice under sub-section (1) is delivered to the Chairman.',
  plain:[['Save as provided in sub-section (5)','except for the pregnancy rule.'],['revoked earlier, expressly or otherwise','taken back in words or by conduct before the period ends.'],['expiration of ninety days','the whole period has to run out; the talaq is not effective while it is still running.'],['from the day on which notice is delivered','counted from delivery to the Chairman, not from the pronouncement.']],
  links:[['s.7(1) notice','r1'],['s.7(4) Council','r6'],['s.7(5) pregnancy','r7']],
  cases:[
   {n:'Muhammad Hassan Sultan v Chairman Union Council, Cantonment Board Office, Karachi and another',c:'Supreme Court of Pakistan, Nov 2025, Civil Petition No. 5364 of 2024',t:'No divorce, in any form, is effective until the 90 days expire; revocation within the period is lawful. Also touches s.8: delegated talaq follows s.7.',v:1}
  ],
  bnd:'<h4>Boundary map: time points (Day 0 = day notice is delivered)</h4><table><tr><th>Point</th><th>Position</th></tr><tr><td>Before notice</td><td>no clock; s.7(3) counts from delivery to the Chairman</td></tr><tr><td>Day 0</td><td>notice delivered; clock starts</td></tr><tr><td>Day 1 to 29</td><td>Chairman may constitute the Council; talaq not effective</td></tr><tr><td>Day 30</td><td>last day for the Chairman to constitute the Council (s.7(4))</td></tr><tr><td>Day 31 to 89</td><td>talaq not effective; revocation still possible</td></tr><tr><td>Day 90</td><td>reading: the ninety days expire at the end of Day 90, so the talaq is not yet effective during it; effective from Day 91 if unrevoked and no pregnancy. Open to argument; not checked against case law</td></tr></table>'},
 {id:'r6',code:'s.7(4)',term:'Arbitration Council within thirty days',sub:'Chairman’s duty; reconciliation',tests:'Chairman’s duty to constitute the Council',exam:true,
  hook:'A thirty-day deadline for the Chairman, a ninety-day wait for the marriage: the gap is for reconciliation.',
  text:'<b>(4)</b> Within thirty days of the receipt of notice under sub-section (1), the Chairman shall constitute an Arbitration Council for the purpose of bringing about a reconciliation between the parties, and the Arbitration Council shall take all steps necessary to bring about such reconciliation.',
  plain:[['Arbitration Council','the Chairman plus a representative of each party (s.2(a)); if a party fails to nominate in the prescribed time, the body formed without that representative is the Council.'],['Chairman','if the Union Council Chairman is non-Muslim, wishes to apply himself, or cannot act, the Council elects a Muslim member as Chairman for this Ordinance (s.2(b) proviso).'],['reconciliation','bringing the spouses back together; the Council’s only stated purpose here.']],
  links:[['s.7(3)','r5'],['s.7(1)','r1']],cases:[],
  bnd:'<h4>Boundary map: who sits on the Council (s.2(a), s.2(b))</h4><table><tr><th>Member</th><th>Rule</th></tr><tr><td>Chairman</td><td>Union Council Chairman, or an appointee; a Muslim member is elected if the Chairman is non-Muslim, interested or unable</td></tr><tr><td>Husband’s representative</td><td>nominated by him</td></tr><tr><td>Wife’s representative</td><td>nominated by her</td></tr><tr><td>A party names no one in time</td><td>Council formed without that representative</td></tr></table><p>The text does not say what a missed thirty-day deadline does to the ninety days. Reading: the s.7(3) clock still runs from delivery of notice. Not checked against case law.</p>'},
 {id:'r7',code:'s.7(5)',term:'Pregnancy',sub:'Later of the ninety days and the end of the pregnancy',ess:'pregnancy extension',exam:true,
  hook:'Pregnancy stretches the clock: the later of ninety days and the end of the pregnancy.',
  text:'<b>(5)</b> If the wife be pregnant at the time talaq is pronounced, talaq shall not be effective until the period mentioned in sub-section (3) or the pregnancy, whichever be later, ends.',
  plain:[['at the time talaq is pronounced','pregnancy is judged at pronouncement, not at notice.'],['whichever be later','if the pregnancy outlasts the ninety days, the talaq waits for it.'],['sub-section (3)','the ninety-day period (printed as “(3)” after a 1961 substitution for “(2)”).']],
  links:[['s.7(3)','r5']],cases:[],
  bnd:'<h4>Boundary map: pregnancy against the 90 days</h4><table><tr><th>Facts</th><th>Effective when</th></tr><tr><td>Not pregnant at pronouncement</td><td>90 days expire (s.7(3))</td></tr><tr><td>Pregnant; pregnancy ends before the 90 days expire</td><td>90 days expire</td></tr><tr><td>Pregnant; pregnancy ends after the 90 days expire</td><td>when the pregnancy ends</td></tr><tr><td>Conceives after pronouncement</td><td>s.7(5) not engaged on its words</td></tr><tr><td>How the pregnancy “ends” (birth, miscarriage)</td><td>text silent; open to argument</td></tr></table>'},
 {id:'r8',code:'s.7(6)',term:'Remarrying the same husband',sub:'Free after the first and second effective talaq; detour after the third',exam:true,tests:'third effective talaq',
  hook:'Twice you may come back freely; the third effective talaq needs a detour.',
  text:'<b>(6)</b> Nothing shall debar a wife whose marriage has been terminated by talaq effective under this section from re-marrying the same husband, without an intervening marriage with a third person unless such termination is for the third time so effective.',
  plain:[['effective under this section','only a talaq that has actually become effective under s.7 counts; one revoked or still within its ninety days does not.'],['intervening marriage with a third person','an actual marriage to someone else in between.'],['for the third time so effective','the third effective termination between the same two people.']],
  links:[['s.7(3)','r5']],cases:[],
  bnd:'<h4>Boundary map: count of effective talaqs</h4><table><tr><th>Effective talaq no.</th><th>Remarry same husband without an intervening marriage?</th></tr><tr><td>1st</td><td>yes</td></tr><tr><td>2nd</td><td>yes</td></tr><tr><td>3rd</td><td>no, unless there is an intervening marriage with a third person</td></tr><tr><td>Revoked, or not yet effective</td><td>does not count towards the three</td></tr></table><p>The text does not use the word halala and does not say what the intervening marriage must involve. Anything beyond the words is outside the Ordinance.</p>'}
 ],
 spar:[
  {q:'Notice is delivered to the Chairman on 1 March. The wife is not pregnant and nothing is revoked. When does the talaq take effect, and what is the Chairman’s separate deadline?',a:'Not before the ninety days from 1 March expire (s.7(3)); on the reading in this app, effective from the 91st day. The Chairman must constitute the Arbitration Council within thirty days of receiving the notice (s.7(4)). The two periods run side by side.'},
  {q:'Cross-module: a wife holds a delegated right of divorce and exercises it. How does s.8 route her through s.7, and what happens if she withdraws on Day 40?',a:'s.8 applies s.7 with the necessary changes, so far as applicable: she gives notice, the Council is formed, the 90 days run. A withdrawal inside the 90 days is a revocation under s.7(3). The Supreme Court’s Hassan Sultan judgment (Nov 2025) upheld a withdrawal of this kind.'},
  {q:'The wife is pregnant when talaq is pronounced and gives birth on Day 60, or on Day 120, after notice on Day 0. When does the talaq take effect in each case?',a:'Birth on Day 60: the ninety days are the later period, so effective once they expire. Birth on Day 120: the pregnancy is the later period, so effective when it ends, on Day 120 (s.7(5)).'},
  {q:'Cross-section: the same couple have had two effective talaqs and remarried freely. A third talaq becomes effective. May they remarry without more? Compare with the s.6 polygamy gate: which requires a prior permission and which a prior marriage?',a:'After the third effective talaq they cannot remarry without an intervening marriage with a third person (s.7(6)). Under s.6 the man needs the Arbitration Council’s written permission before a further marriage while one subsists; under s.7(6) the barrier is a marriage by the wife to someone else.'}
 ]
};

MD[5].gate={title:'Walk a case through s.7',timeline:true,steps:[
 {id:'pron',t:'Talaq pronounced in any form?',ref:'s.7(1)',q:'Has the husband pronounced talaq, in any form?',
  y:{n:'Any form whatsoever brings s.7 into play.'},
  n:{n:'No pronouncement, no talaq.',end:'No talaq has been pronounced, so s.7 has nothing to act on. The marriage continues.'}},
 {id:'notice',t:'Written notice to the Chairman, copy to the wife',ref:'s.7(1), s.7(2)',q:'Has the husband given the Chairman written notice and supplied a copy to the wife?',
  y:{n:'Notice delivered: the ninety days run from the day it reaches the Chairman (s.7(3)). Enter that date below to see the dates.'},
  n:{n:'No notice: the s.7(3) clock has not started, and s.7(2) punishes the omission.',end:'The ninety days run only from delivery of notice to the Chairman (s.7(3)), so the clock has not started. The husband is exposed to s.7(2): simple imprisonment up to one year, or fine up to Rs 5,000, or both. Whether a talaq without notice can ever take effect is not answered by the text. Gardezi (PLD 1963 SC 51) is cited on notice being mandatory; later authority has not been traced.'}},
 {id:'jafri',t:'Fiqah-e-Jafria parties?',ref:'s.7(1) proviso, s.7(1A)',q:'Do the parties belong to Fiqah-e-Jafria?',
  y:{n:'The proviso applies: free-will pronouncement in literal Arabic words before two witnesses; ineffective if jokingly or under anger, intoxication, insanity, duress or coercion; disputes to a court or a Mujtahid-e-Alam. Later steps assume a valid pronouncement.'},
  n:{n:'Ordinary route: the proviso and s.7(1A) are not engaged.'}},
 {id:'council',t:'Arbitration Council within thirty days',ref:'s.7(4)',q:'Did the Chairman constitute the Arbitration Council within thirty days of receiving the notice?',
  y:{n:'Council constituted: it must take all steps necessary to bring about reconciliation.'},
  n:{n:'Deadline missed: s.7(4) states a duty but not what a miss does to the ninety days. Reading: the s.7(3) clock still runs from delivery of notice.'}},
 {id:'preg',t:'Wife pregnant at pronouncement?',ref:'s.7(5)',q:'Was the wife pregnant at the time talaq was pronounced?',
  y:{n:'Pregnant: effective on the later of the ninety days and the end of the pregnancy.'},
  n:{n:'Not pregnant at pronouncement: the plain ninety days apply. A later conception does not engage s.7(5), which speaks of the time of pronouncement.'}},
 {id:'rev',t:'Revoked before it took effect?',ref:'s.7(3)',q:'Was the talaq revoked, expressly or otherwise, before the period ended?',
  y:{n:'Revoked earlier.',end:'Revoked earlier, expressly or otherwise: the talaq never becomes effective under s.7(3) and the marriage continues. The Supreme Court (Hassan Sultan, Nov 2025) upheld a revocation within the ninety days, including a wife’s withdrawal of a notice given under a delegated right.'},
  n:{n:'Not revoked: continue to the result.'}},
 {id:'third',t:'Third effective talaq between them?',ref:'s.7(6)',q:'Is this the third time a talaq between these two has become effective under s.7?',
  y:{n:'Third effective talaq: no remarriage to the same husband without an intervening marriage with a third person.'},
  n:{n:'First or second effective talaq: remarriage to the same husband is not barred.'}}
],
 final:function(m){
  var preg=m.preg==='y',third=m.third==='y';
  var r=preg?'Effective on the <b>later of</b> (a) the expiry of ninety days from the day notice is delivered to the Chairman and (b) the end of the pregnancy (s.7(5)).':'Effective on the <b>expiry of ninety days</b> from the day notice is delivered to the Chairman (s.7(3)).';
  if(S.date)r+='<br>Day 0: '+dstr(addDays(S.date,0))+'. Council deadline (Day 30): '+dstr(addDays(S.date,30))+'. Ninety days expire at the end of '+dstr(addDays(S.date,90))+'; on the reading in this app the talaq is effective from '+dstr(addDays(S.date,91))+(preg?' at the earliest, if the pregnancy has ended by then':'')+'.';
  r+='<br>Remarriage to the same husband: '+(third?'barred without an intervening marriage with a third person (s.7(6)).':'not barred (s.7(6)).');
  return r;
 }};

MD[6]={
 tag:'Module 6 · s.8 · Accordion',
 title:'Dissolution otherwise than by talaq',
 intro:'Section 8 is one sentence long. It does not create a right to dissolve a marriage; it sends two situations through the procedure of section 7: a wife exercising a delegated right of divorce, and any party dissolving the marriage by some route other than talaq.',
 recall:'Two triggers: the right to divorce was delegated to the wife and she uses it, or any party wants to dissolve otherwise than by talaq. In both, s.7 applies mutatis mutandis, so far as applicable. The section names neither khula nor the Dissolution of Muslim Marriages Act 1939.',
 rails:[
 {id:'r1',code:'s.8',term:'The section in full',sub:'A borrowing section: it applies section 7 with changes as needed',ess:'duly delegated; otherwise than by talaq; mutatis mutandis',exam:true,
  hook:'Section 8 owns no procedure of its own; it rents section 7’s.',
  text:'<b>8. Dissolution of marriage otherwise than by talaq.</b>&mdash;Where the right to divorce has been duly delegated to the wife and she wishes to exercise that right, or where any of the parties to a marriage wishes to dissolve the marriage otherwise than by talaq, the provisions of section 7 shall, <i>mutatis mutandis</i> and so far as applicable, apply.',
  plain:[['duly delegated','the husband must have validly given the wife the power; the usual place is a clause of the nikah nama, and the text does not say where it must be recorded.'],['otherwise than by talaq','any route except the husband’s pronouncement; the text names none.'],['mutatis mutandis','with the necessary changes in the names and roles.'],['so far as applicable','a limit: the parts of s.7 that fit are used and the rest are not.']],
  ex:'A nikah nama gives the wife the right to pronounce divorce on herself. She exercises it. Under s.8 she gives written notice to the Chairman, with a copy to the husband, and the ninety days and the Council run as for a talaq. Reading of the text; the changes of role are not spelled out.',
  links:[['s.7 procedure','5:r1'],['s.7(1) notice','5:r1'],['s.7(3) ninety days','5:r5'],['s.10 and the nikah nama','8:r2'],['s.13 omitted DMMA amendment','9:r4']],
  cases:[
   {n:'Khurshid Bibi v Baboo Muhammad Amin',c:'PLD 1967 SC 97',t:'Commonly cited for the Supreme Court’s recognition of khula, with the court able to dissolve the marriage where the wife shows she cannot live within the limits of Allah. Citation from memory.',v:2}
  ],
  bnd:'<h4>Boundary map: routes to ending a marriage</h4><table><tr><th>Route</th><th>Governed by s.7 procedure?</th></tr><tr><td>Talaq by the husband</td><td>yes: s.7 itself</td></tr><tr><td>Delegated talaq by the wife</td><td>yes: s.8, first limb</td></tr><tr><td>Any other dissolution sought by a party</td><td>yes, so far as applicable: s.8, second limb</td></tr><tr><td>Death of a spouse</td><td>no: the marriage ends without dissolution</td></tr><tr><td>Decree of a court</td><td>the text does not say; the interaction with s.7 is open to argument</td></tr></table>'},
 {id:'r2',code:'s.8 (first limb)',term:'Delegated right of divorce exercised by the wife',sub:'The wife stands where the husband stood',tests:'duly delegated; wife’s notice to the Chairman',
  hook:'When the husband lends the power, the wife walks the same road he would.',
  text:'<b>8.</b> … Where the right to divorce has been duly delegated to the wife and she wishes to exercise that right, … the provisions of section 7 shall, <i>mutatis mutandis</i> and so far as applicable, apply.',
  plain:[['the right to divorce … delegated','also called tafweez-e-talaq; the term is not used in the text.'],['she wishes to exercise that right','she, not the husband, gives the s.7(1) notice.']],
  links:[['s.7(1) notice and copy','5:r1'],['s.7(4) Council','5:r6'],['s.7(5) pregnancy','5:r7'],['s.7(3) 90 days','5:r5']],cases:[],
  bnd:'<h4>Boundary map: s.7 steps as they map to a delegated divorce</h4><table><tr><th>s.7 step</th><th>Reading under s.8</th></tr><tr><td>Man pronouncing talaq</td><td>wife exercising the delegated right</td></tr><tr><td>Notice to Chairman, copy to the other party</td><td>wife gives notice to the Chairman, copy to the husband</td></tr><tr><td>Council tries to bring about reconciliation</td><td>unchanged</td></tr><tr><td>Effectiveness after ninety days</td><td>unchanged</td></tr><tr><td>Pregnancy of the wife</td><td>unchanged: the wife is the one divorcing herself and the pregnancy bar still runs</td></tr><tr><td>Penalty for no notice (s.7(2))</td><td>the penalty names “any man”; whether it reaches a wife is open to argument</td></tr></table>'},
 {id:'r3',code:'s.8 (second limb)',term:'Any party dissolving otherwise than by talaq',sub:'Wide words with no named route',tests:'what the second limb covers',
  hook:'The second limb is a net with no label on it.',
  text:'<b>8.</b> … or where any of the parties to a marriage wishes to dissolve the marriage otherwise than by talaq, the provisions of section 7 shall, <i>mutatis mutandis</i> and so far as applicable, apply.',
  plain:[['any of the parties','husband or wife.'],['otherwise than by talaq','the text does not say what these are; khula and judicial dissolution are the usual examples from outside the text.'],['so far as applicable','a court decree cannot sensibly give a notice to the Chairman; where applicable, the s.7 steps govern.']],
  links:[['s.13 omitted','9:r4'],['s.7','5:r1']],
  cases:[
   {n:'Khurshid Bibi v Baboo Muhammad Amin',c:'PLD 1967 SC 97',t:'Citation from memory: khula by court decree. Whether the s.7 procedure is also required for a khula decree is not settled by the text of s.8.',v:2}
  ],
  bnd:'<h4>Boundary map: what the second limb is not</h4><table><tr><th>Item</th><th>In the text of s.8?</th></tr><tr><td>Khula</td><td>not named</td></tr><tr><td>Dissolution of Muslim Marriages Act 1939</td><td>not named</td></tr><tr><td>Mubarat (mutual release)</td><td>not named</td></tr><tr><td>Judicial decree</td><td>not named</td></tr></table><p>The handoff’s list of these routes is outside the text of the section. Treat any claim that s.8 “covers khula” as an interpretation, not a quotation.</p>'}
 ],
 spar:[
  {q:'Section 8 says s.7 applies “so far as applicable”. Give one step of s.7 that fits a wife’s delegated divorce and one that fits awkwardly.',a:'Fits: the notice to the Chairman with a copy to the other party, and the ninety-day period. Awkward: s.7(2), the penalty, is addressed to “any man” who fails to give notice, so whether it reaches a wife who fails is open to argument.'},
  {q:'A wife seeks dissolution by court decree under the Dissolution of Muslim Marriages Act 1939. Does s.8 require her to give a notice to the Chairman?',a:'The text of s.8 does not mention the 1939 Act or decrees. It speaks of a party who “wishes to dissolve the marriage otherwise than by talaq”. Whether a court decree needs the s.7 notice is open to argument; the text does not settle it.'},
  {q:'Cross-module: a nikah nama delegates the right of divorce to the wife and leaves the dower column blank. She exercises the right. What dower does she get and when, and what happens to the marriage?',a:'Section 10: with no mode of payment specified, the entire dower is payable on demand. The marriage ends under s.8 by applying the s.7 procedure: notice, Council, and effectiveness ninety days after notice, unless she is pregnant.'},
  {q:'Cross-module: the husband remarries while his wife’s delegated divorce is still inside its ninety days. Is s.6 engaged?',a:'On the same reading as for a talaq, her marriage has not yet ended, so he contracts another marriage during an existing one and needs the Council’s previous permission (s.6(1)). A reading from ss.6, 7 and 8 together; not tested in a case.'}
 ]
};

MD[7]={
 tag:'Module 7 · s.9 · Accordion',
 title:'Maintenance',
 intro:'Section 9 gives a wife (or several wives) a quick route to a maintenance order: apply to the Chairman, who forms an Arbitration Council, which issues a certificate fixing the amount. Revision goes to the Collector. Arrears are recoverable as arrears of land revenue.',
 recall:'Husband fails to maintain adequately (or equitably, among wives). Wife applies to the Chairman. Council issues a certificate with an amount (1). Either side may seek revision to the Collector; final (2). Unpaid amounts are recovered as arrears of land revenue (3).',
 rails:[
 {id:'r1',code:'s.9(1)',term:'Failure to maintain: the application and the certificate',sub:'“Adequately” for one wife; “equitably” among several; other remedies remain',ess:'fails to maintain adequately or equitably; apply to the Chairman; Council certificate',exam:true,
  hook:'One wife is owed enough; several are owed fairness.',
  text:'<b>9. Maintenance.</b>&mdash;<b>(1)</b> If any husband fails to maintain his wife adequately, or where there are more wives than one, fails to maintain them equitably, the wife, or all or any of the wives, may in addition to seeking, any other legal remedy available apply to the Chairman who shall constitute an Arbitration Council to determine the matter, and the Arbitration Council may issue a certificate specifying the amount which shall be paid as maintenance by the husband.',
  plain:[['adequately … equitably','two measures: “adequately” for a single wife, “equitably” where there are several.'],['all or any of the wives','one wife may apply, or all together.'],['in addition to seeking any other legal remedy','this route sits beside others (a suit in the Family Court, for example); it does not displace them.'],['may issue a certificate','a discretion: the Council may; the text does not say “shall”.']],
  ex:'A husband with two wives spends heavily on the second household and leaves the first without enough. The first wife applies to the Chairman under s.9(1). The Council can issue a certificate fixing what he must pay her; she keeps her other remedies.',
  links:[['s.2(a) Council','1:r4'],['s.9(2) revision','r2'],['s.9(3) recovery','r3'],['s.6 polygamy','4:r1'],['s.9(1A) Punjab text','r4']],
  cases:[
  ],
  bnd:'<h4>Boundary map: how many wives, which standard</h4><table><tr><th>Wives</th><th>Standard of maintenance</th><th>Who applies</th></tr><tr><td>One</td><td>adequate</td><td>the wife</td></tr><tr><td>Two or more</td><td>equitable among them</td><td>any wife, some, or all</td></tr></table><table><tr><th>Maintenance</th><th>Within s.9(1)?</th></tr><tr><td>Paid in full</td><td>no failure, no application</td></tr><tr><td>Paid, but too little</td><td>yes: not adequate</td></tr><tr><td>Not paid at all</td><td>yes</td></tr><tr><td>Child’s maintenance</td><td>not in the federal text; see the Punjab text in the last rail</td></tr></table>'},
 {id:'r2',code:'s.9(2)',term:'Revision to the Collector',sub:'Husband or wife; prescribed manner, period and fee; final',ess:'revision of the certificate; Collector; final',exam:true,
  hook:'Either side may ask the Collector to look again; after that, no further door.',
  text:'<b>(2)</b> A husband or wife may, in the prescribed manner, within the prescribed period, and on payment of the prescribed fee, prefer an application for revision of the certificate, to the Collector concerned and his decision shall be final and shall not be called in question in any Court.',
  plain:[['A husband or wife','either may seek revision: the husband to reduce it, the wife to raise it.'],['prescribed manner, period, fee','left to the Rules.'],['final … not … called in question in any Court','the text excludes court challenge; how far that holds is outside the Ordinance and not checked.']],
  links:[['s.6(4) the same device','4:r4'],['s.11 Rules','9:r1']],cases:[],
  bnd:'<h4>Boundary map: after the certificate issues</h4><table><tr><th>Who is unhappy</th><th>Remedy in s.9(2)</th></tr><tr><td>Husband (too high)</td><td>revision to the Collector</td></tr><tr><td>Wife (too low)</td><td>revision to the Collector</td></tr><tr><td>Neither</td><td>certificate stands; s.9(3) recovery</td></tr><tr><td>Either, after the Collector decides</td><td>final on the words</td></tr></table>'},
 {id:'r3',code:'s.9(3)',term:'Recovery as arrears of land revenue',sub:'Amount payable under (1) or (2), if not paid in due time',ess:'if not paid in due time; arrears of land revenue',exam:true,
  hook:'A maintenance certificate collects like a tax bill.',
  text:'<b>(3)</b> Any amount payable under sub-section (1) or (2), if not paid in due time, shall be recoverable as arrears of land revenue.',
  plain:[['under sub-section (1) or (2)','the original certificate, or the amount as revised by the Collector.'],['in due time','the time set by the certificate; the text does not state a default period.'],['arrears of land revenue','recovered by the revenue machinery.']],
  links:[['s.6(5)(a) dower recovered the same way','4:r5']],cases:[],
  bnd:'<h4>Boundary map: two ways to collect in the Ordinance</h4><table><tr><th>Provision</th><th>What is recovered</th></tr><tr><td>s.6(5)(a)</td><td>dower due to existing wives after an unpermitted marriage</td></tr><tr><td>s.9(3)</td><td>maintenance fixed by certificate or revision</td></tr></table>'},
 {id:'r4',code:'s.9(1A) (Punjab text)',term:'Child maintenance: not in the federal text',sub:'A Punjab Police compilation shows an added sub-section; amending Act not traced',tests:'text variant: federal against Punjab',
  hook:'Check which text you are reading before you quote a sub-section number.',
  text:'<i>Not reproduced.</i> The bare act used in this app (updated till 10-3-2022) has no sub-section (1A) in section 9.',
  plain:[['Punjab compilation','shows a sub-section (1A) on a child’s maintenance; the amending Act is not identified in this build, and the wording was not verified.']],
  links:[['s.9(1)','r1']],cases:[],
  bnd:'<h4>Boundary map: text versions</h4><table><tr><th>Text</th><th>s.9 sub-sections</th></tr><tr><td>Federal bare act (to 10-3-2022)</td><td>(1), (2), (3)</td></tr><tr><td>Punjab Police compilation (undated)</td><td>(1), (1A), (2), (3), as printed there</td></tr></table>'}
 ],
 spar:[
  {q:'A husband has two wives. He supports the first well and the second badly. Who may apply under s.9(1), and on what standard?',a:'The second wife (or both, since the section lets “all or any of the wives” apply). The standard for several wives is “equitably”, not “adequately”. The Council may issue a certificate fixing what he pays.'},
  {q:'A certificate fixes Rs 20,000 a month. The husband does not pay for four months. How does the wife recover, and can the husband challenge the certificate?',a:'Under s.9(3) the arrears are recoverable as arrears of land revenue. The husband may seek revision to the Collector within the prescribed period (s.9(2)); the Collector’s decision is final.'},
  {q:'Cross-module: compare the revision device in s.9(2) with s.6(4). What is the same and what is different?',a:'Same: revision goes to the Collector, in the prescribed manner, period and fee, and his decision is final and cannot be called in question in any court. Different: s.6(4) follows a decision on permission to marry again, where “any party” may apply; s.9(2) follows a maintenance certificate, where “a husband or wife” may apply.'},
  {q:'Cross-module: a wife’s talaq is within its ninety-day period and the husband stops paying maintenance. Can she use s.9?',a:'On the reading in this app the marriage still subsists until the talaq takes effect (s.7(3)), so she is still “his wife” and s.9(1) is open to her. Not tested in a case.'}
 ]
};

MD[8]={
 tag:'Module 8 · s.10 · Accordion',
 title:'Dower',
 intro:'Section 10 is a default rule for silence: if the nikah nama or marriage contract does not say how dower is to be paid, the whole of it is payable on demand. The text says nothing about the amount, and it does not define prompt or deferred dower.',
 recall:'No details of the mode of payment in the nikah nama or contract: the entire dower is payable on demand. Where details are given, they govern. Dower also surfaces in s.6(5)(a): entire dower, prompt or deferred, due at once after an unpermitted second marriage.',
 rails:[
 {id:'r1',code:'s.10',term:'Silence on the mode of payment: all on demand',sub:'A default rule, not a rule on the amount',ess:'no details about the mode of payment; entire amount; payable on demand',exam:true,
  hook:'Say nothing in the contract and the law says: all of it, whenever she asks.',
  text:'<b>10. Dower.</b>&mdash;Where no details about the mode of payment of dower are specified in the nikah nama, or the marriage contract, the entire amount of the dower shall be prescribed to be payable on demand.',
  plain:[['no details about the mode of payment','the document is silent on how and when to pay.'],['nikah nama, or the marriage contract','either document can carry the terms.'],['entire amount','not half: the whole dower.'],['payable on demand','due when the wife asks; no waiting for divorce or death.'],['shall be prescribed to be','printed so in the bare act; read as “deemed to be”.']],
  ex:'A nikah nama records a dower of Rs 500,000 and leaves the column on payment blank. Under s.10 the whole Rs 500,000 is payable on demand.',
  links:[['s.6(5)(a)','4:r5'],['s.5(5) nikah nama form','3:r5'],['nikah nama details','r2']],
  cases:[
  ],
  bnd:'<h4>Boundary map: what the contract says against what s.10 does</h4><table><tr><th>Nikah nama on payment</th><th>Result</th></tr><tr><td>Entire dower stated as prompt</td><td>payable on demand (the stated mode)</td></tr><tr><td>Part prompt, part deferred</td><td>as stated; s.10 does not apply</td></tr><tr><td>All deferred to a stated event</td><td>as stated; s.10 does not apply</td></tr><tr><td>Blank or silent on the mode</td><td>s.10: entire amount on demand</td></tr><tr><td>Silent on the amount too</td><td>s.10 does not fix an amount; the text is silent</td></tr></table>'},
 {id:'r2',code:'s.10 and the nikah nama',term:'Where the details live',sub:'The nikah nama columns for dower and special conditions',tests:'where the mode of payment is recorded',
  hook:'The rule only works if someone reads the columns aloud before signing.',
  text:'<i>Not a separate section.</i> Section 5(5) leaves the form of the nikah nama to the Rules; section 10 refers to the nikah nama and the marriage contract as the documents that may state the mode of payment.',
  plain:[['nikah nama','prescribed form under the Rules; see Module 3.'],['marriage contract','a wider term: terms agreed apart from the form.']],
  links:[['s.5(5)','3:r5'],['s.10','r1']],
  cases:[
   {n:'Supreme Court directions to Registrars on completing the Nikahnama (title not given)',c:'Supreme Court of Pakistan, 22 September 2026',t:'Reported as directing Registrars to fill every column, read the dower and special-condition entries to the parties, and give them copies.',v:1,fl:'news report'}

/* ---------- GATE ---------- */
function stepIdx(g,id){for(var i=0;i<g.steps.length;i++)if(g.steps[i].id===id)return i;return -1}
function walk(g){
 var path=[],i=0,end=null,fin=false,k;
 for(k=0;k<S.ans.length;k++){
  var st=g.steps[i],v=S.ans[k],br=st[v];
  path.push({i:i,v:v});
  if(br.end){end=br.end;i=-1;break}
  i=br.go?stepIdx(g,br.go):i+1;
  if(i>=g.steps.length){fin=true;i=-1;break}
 }
 return {path:path,active:(end||fin)?-1:i,end:end,fin:fin};
}
function gate(n){
 var g=MD[n].gate,w=walk(g),vis={},map={},list=[];
 w.path.forEach(function(p){vis[p.i]=p.v;map[g.steps[p.i].id]=p.v});
 var ref=w.active>=0?w.active:(w.path.length?w.path[w.path.length-1].i:-1);
 g.steps.forEach(function(st,k){
  if(vis[k]!==undefined)list.push([k,'done']);
  else if(k===w.active)list.push([k,'act']);
  else if(k>ref)list.push([k,'pend']);
 });
 var h='<div class="gate"><h3 class="serif">'+g.title+'</h3>';
 list.forEach(function(it,pos){

  h+='</div></div>';
 });

 return h+'</div>';
}
